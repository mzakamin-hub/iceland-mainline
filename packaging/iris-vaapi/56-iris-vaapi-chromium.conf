# iris-vaapi-chromium: Fedora's chromium wrapper passes CHROMIUM_FLAGS (unless the user sets CHROMIUM_USER_FLAGS).
# AcceleratedVideoDecoder is the Linux hardware-decode gate (off by default in builds without VA-API, as Fedora 44's
# aarch64 chromium, which then decodes through the Iris V4L2 node); VaapiVideoDecoder is the VA-API backend of
# VA-API builds.
CHROMIUM_FLAGS=--enable-features=AcceleratedVideoDecoder,VaapiVideoDecoder
