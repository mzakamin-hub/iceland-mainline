# iceland-coexist: Fedora 44 next to Arch Linux ARM in one shared /boot (60-iceland-coexist.install)
# the device tree of Fedora's entries: kaanapali-oneplus-iceland-<DTB_VARIANT>.dtb from /usr/lib/iceland/dtb/<kver>/ (or
# the kernel's own dtb/qcom/), else the kernel's own tree; standard = always the kernel's own tree
# 1.0-8: standard by default. The glitchfix-rails variant (LDOs held in high-power mode) is not needed: the display
# glitch it was made for is cured by the kernel's dwc3-qcom keep_icc_runtime (q90d and later; tested 30 Oct 2026)
DTB_VARIANT=standard
# Fedora's subdirectory of the shared ext4 (bind-mounted at /boot by /etc/fstab)
SUBDIR=fedora44
# the Arch entry that was the default when the kit installed Fedora (saved_entry falls back to it when the last Fedora
# kernel is removed); written by the kit
ARCH_DEFAULT=
