# /etc/iceland/camera-focus.conf - the fixed lens position of the rear camera (there is no autofocus yet).
# The value is the motor's position code, 0 .. 1023 (0 = motor at rest, the far end; larger = closer).
#
# 450  stock's own start position, where its camera puts the lens before autofocus has measured anything
#      (CustomActuatorInitDac of icelandmain_actuator in the stock camera configuration). Sharp at roughly arm's
#      length to across a table. The default.
# The module's calibration (EEPROM of this tablet: 352, 398 near the far end, 734 / 736 at the 10 cm end) puts the
# setting for "everything from about 1 m to the horizon" (stock's hyperfocal distance, 0.45 dioptres) at 369 or
# 413, depending on which of the two far-end words is the infinity position. One look at a distant object decides
# (the "focus" test prints the sharpest code of a fine sweep); then set FOCUS to that value for landscape use.
# Larger values focus closer: roughly 470 .. 500 for a sheet of paper at 30 cm, 734 for 10 cm.
FOCUS=450
# seconds between two looks at the sensor's power state
POLL=1
