# iceland-device: bring the display, touch and GPU up from the initramfs (troikoss lesson: firmware the early
# drivers need must be inside the initramfs, or they fail before the root filesystem is mounted).
add_drivers+=" msm panel-novatek-nt36536 ktz8869_iceland nt36536_ts "
# Tablet firmware lives in /usr/lib/firmware/updates (written from the tablet's own partitions by the installer,
# never shipped). Missing files only produce a dracut warning.
install_items+=" /usr/lib/firmware/updates/qcom/gen80200_sqe.fw /usr/lib/firmware/updates/qcom/gen80200_gmu.bin /usr/lib/firmware/updates/qcom/gen80200_aqe.fw /usr/lib/firmware/updates/qcom/kaanapali/iceland/gen80200_zap.mbn /usr/lib/firmware/updates/novatek/novatek_nt36536_fw.bin "
