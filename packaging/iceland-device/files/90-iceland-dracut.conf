# iceland-device: bring the display, touch and GPU up from the initramfs (troikoss lesson: firmware the early
# drivers need must be inside the initramfs, or they fail before the root filesystem is mounted).
add_drivers+=" msm panel-novatek-nt36536 ktz8869_iceland nt36536_ts "
# The GPU microcode (gen80200 sqe / gmu / aqe) is Fedora's qcom-firmware (upstream linux-firmware, xz; held in dnf,
# so it changes only when released after a rehearsal, and reaches this initramfs with the next kernel-iceland).
# The tablet's own firmware lives in /usr/lib/firmware/updates (written from its partitions by the installer,
# never shipped). Missing files only produce a dracut warning.
install_items+=" /usr/lib/firmware/qcom/gen80200_sqe.fw.xz /usr/lib/firmware/qcom/gen80200_gmu.bin.xz /usr/lib/firmware/qcom/gen80200_aqe.fw.xz /usr/lib/firmware/updates/qcom/kaanapali/iceland/gen80200_zap.mbn /usr/lib/firmware/updates/novatek/novatek_nt36536_fw.bin "
# 0.28-19: stock's GPU GMU / SQE pair (iceland-firmware >= 11.A.38-5), used with
# firmware_class.path=/usr/lib/firmware/iceland-gpu-stock (iceland-cmdline, GPU_FW=stock): the GPU loads its microcode
# from the initramfs, so the pair must be in it too, or the kernel would take linux-firmware's copies listed above.
install_items+=" /usr/lib/firmware/iceland-gpu-stock/qcom/gen80200_gmu.bin /usr/lib/firmware/iceland-gpu-stock/qcom/gen80200_sqe.fw "
# 0.28-20: the vendor GPU pair v5.3.33 / 0x094 (iceland-firmware >= 11.A.38-6), used with
# firmware_class.path=/usr/lib/firmware/iceland-gpu-vendor533 (GPU_FW=vendor533, the default): both pairs are in
# every initramfs, so switching GPU_FW needs no initramfs rebuild.
install_items+=" /usr/lib/firmware/iceland-gpu-vendor533/qcom/gen80200_gmu.bin /usr/lib/firmware/iceland-gpu-vendor533/qcom/gen80200_sqe.fw "
