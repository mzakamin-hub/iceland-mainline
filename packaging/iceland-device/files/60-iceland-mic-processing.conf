# iceland-device: a processed microphone for the OnePlus Pad 4 (owner's issue: GNOME's input level bar reached about a
# quarter). PipeWire's echo-cancel module with the WebRTC backend (Fedora 44: pipewire-libs ships
# /usr/lib64/spa-0.2/aec/libspa-aec-webrtc.so, linked against webrtc-audio-processing's libwebrtc-audio-processing-2)
# turns the raw UCM source into "Internal microphones (voice processing)": automatic gain control, noise suppression,
# high-pass filter, and echo cancellation against what the speakers play (monitor mode: the default sink's monitor is
# the reference; no extra sink is created).
#   - 0.28-5: the canceller's output is the HIDDEN node iceland_mic_aec (media.class Audio/Source/Internal: not listed in
#     GNOME's Sound settings, never a default). 61-iceland-mic-gain.conf records from it, adds stock's 14 dB recorder gain
#     (after the canceller: TX_DEC stays at stock's 84, so the canceller sees unclipped echo) under a -1 dBFS limiter, and
#     is "Internal microphones (voice processing)" (iceland_mic_processed). That source has a higher session priority than
#     the raw source (UCM CapturePriority 100 -> WirePlumber 1712), so WirePlumber makes it the default for accounts that
#     never chose one. A choice made in GNOME's Sound settings is kept.
#   - The raw source stays available ("Built-in Audio Internal microphones") for recordings without processing.
#   - Fail-safe: flags ifexists + nofail. A missing module or WebRTC backend, or a backend that fails to start, only
#     skips this module: PipeWire starts as before. 0.28-5 limit: the gain stage (61-iceland-mic-gain.conf) still loads
#     and its "Internal microphones (voice processing)" then has no input but stays the default by priority - choose
#     "Internal microphones (raw)" in GNOME's Sound settings, or turn both off with the switch below. (pipewire-libs,
#     required >= 1.6.8, ships the WebRTC backend; r141 / r155 ran it.)
#   - The capture stream and the reference stream are passive: the microphone is opened only while something records
#     from the processed source, and the speaker path is not kept awake.
# Turning it off: PipeWire loads every *.conf in /usr/share/, /etc/ and ~/.config/pipewire/pipewire.conf.d/ (a file
# with this name elsewhere does not replace this one) and loads this module only while the context property
# iceland.mic-processing is not false. A drop-in such as 90-iceland-mic-off.conf with the one line
#     context.properties = { iceland.mic-processing = false }
# in /etc/pipewire/pipewire.conf.d/ turns it off for every account, in ~/.config/pipewire/pipewire.conf.d/ for one
# account (= true there turns it back on for that account); then systemctl --user restart pipewire (or log in again).
# Without a drop-in: choose "Built-in Audio Internal microphones" as Input in GNOME's Sound settings; the processed
# source stays but opens nothing while unused.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        flags = [ ifexists nofail ]
        # off when a drop-in sets context.properties = { iceland.mic-processing = false } (see above)
        condition = [ { iceland.mic-processing = !false } ]
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = true
            # one voice channel: the two analog microphones (AMIC1 bottom, AMIC5 back) are mixed down
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            node.latency = 480/48000
            aec.args = {
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.gain_control = true
                # mobile mode = the reduced-complexity canceller for phones; the full one runs fine here
                webrtc.mobile_mode = false
            }
            capture.props = {
                node.name = "capture.iceland_mic_processed"
                node.description = "Voice processing capture"
                # the raw UCM source of the Pad 4 (alsa_input.<card>.HiFi__<UCM device>__source)
                target.object = "alsa_input.platform-sound.HiFi__Mic__source"
                node.passive = true
                node.dont-fallback = true
                # WirePlumber 0.5 destroys a dont-fallback stream whose target is not there yet, and the ALSA source
                # appears after this module at every PipeWire start (r2t / r2u, 10 Oct 2026): linger = wait for it
                node.linger = true
            }
            sink.props = {
                node.name = "capture.iceland_mic_reference"
                node.passive = true
            }
            source.props = {
                # 0.28-5: hidden; the visible "Internal microphones (voice processing)" is 61-iceland-mic-gain.conf's output
                node.name = "iceland_mic_aec"
                node.description = "Voice processing (echo cancelled, before the 14 dB gain)"
                media.class = "Audio/Source/Internal"
            }
        }
    }
]
