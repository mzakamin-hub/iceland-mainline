# iceland-thermal settings (read every period, no restart needed). One line per setting. The tables themselves are
# stock's and live in /usr/libexec/iceland/iceland-thermal. The shell temperature model is
# /etc/iceland/thermal-model.json: a private file that is NOT part of the package; without it the battery
# temperature + 2 C stands in for the shell estimate.
# This service only ever lowers limits (and takes its own back). The kernel's thermal zones stay underneath,
# among them the kernel's own loop on the skin thermistor (stock's trips 60 / 61 C).
#
# ENABLE=0 switches the policy off (the kernel's own thermal zones stay).
ENABLE=1
# Seconds between samples. Stock's estimate is fitted for 5 s; change it only for tests.
PERIOD=5
# Gears added per GNOME power mode. One gear is 2 C of shell temperature (1 C between 39 and 41 C).
# Stock's values: powersave_mode_item +1, normal_mode_item 0, racing_mode_item -4.
#   OFFSET_BALANCED=0  = OxygenOS in an ordinary app: CPUs capped at 2.36 / 1.86 GHz from 33 C shell temperature,
#                        which the tablet reaches at idle.
#   OFFSET_BALANCED=-4 = OxygenOS's high-performance mode: every step 8 C later, first CPU cap at 40 C.
# Shipped: 0 = stock's normal table, together with the kernel's skin loop at stock's 60 / 61 C trips (the owner's
# decision of 3 Oct 2026: stock's 60 / 61 C loop with its gear policy). -4 belonged with the old 48 / 51 C loop.
OFFSET_POWERSAVE=1
OFFSET_BALANCED=0
OFFSET_PERFORMANCE=-4
# Performance mode table: "global" (stock's table, shifted by OFFSET_PERFORMANCE) or "benchmark" (the table stock
# gives its benchmark app list: no CPU cap below 51 C shell temperature, no offset).
POLICY_PERFORMANCE=global
# Which limits are applied (1 = yes): CPU frequency caps, the GPU frequency cap, the brightness cap, the
# charge-current cap handed to iceland-battery-guard (/run/iceland/thermal-fcc-ma).
# BRIGHTNESS=1 (0.28-6): the brightness cap per gear goes to the backlight driver's cooling device
# (ktz8869-backlight): the kernel lowers the panel, GNOME's brightness setting stays as the user left it. Without
# that device (an older kernel) there is no brightness cap. The backlight itself is never written by this service.
CPU=1
GPU=1
BRIGHTNESS=1
CHARGE=1
# Battery-current cap for stock's charge cool-down levels 4 and above (9 V x 1.5 A input); 0 = no cap for them.
# Levels 1 to 3 are stock's 1200 / 1500 / 2000 mA.
CHARGE_MA_HIGH=3000
# CHARGE_SHIFT=0: a negative mode offset does not relax the charging cool-down (the charge cap always follows
# stock's normal table). CHARGE_SHIFT=1: the charge cap shifts with the mode, as stock does in its
# high-performance mode.
CHARGE_SHIFT=0
