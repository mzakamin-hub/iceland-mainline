# iceland-device: shadows alsa-lib's /usr/lib/modprobe.d/dist-alsa.conf (kmod: a file of the same name in
# /etc/modprobe.d replaces the one in /usr/lib/modprobe.d).
#
# alsa-lib's file says: install snd-pcm /sbin/modprobe --ignore-install snd-pcm && /sbin/modprobe snd-seq
# kernel-iceland has no sequencer (CONFIG_SND_SEQUENCER is not set), so that install command fails, and kmod then
# reports the whole load as failed to udev. At boot udev's coldplug loads the audio drivers in parallel; every worker
# that reached snd-pcm first aborted (R1d / R2: 7-11 "Error running install command ... snd_pcm: retcode 1"), so the
# LPASS macros, the SoundWire controllers and the APM / PRM drivers never loaded and there was no sound card. udev does
# not retry a failed load. A softdep keeps the intent (the sequencer is loaded when it exists) and never fails.
softdep snd-pcm post: snd-seq
