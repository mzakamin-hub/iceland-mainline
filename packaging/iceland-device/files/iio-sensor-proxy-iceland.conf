# iceland-device: /usr/lib/systemd/system/iio-sensor-proxy.service.d/iceland.conf
# The sensors answer only after hexagonrpcd has attached the sensors PD and the sensor hub has read its files:
# start hexagonrpcd first, then wait until the accelerometer really delivers a sample (iceland-ssc-wait; QMI
# service 400 alone is on the QRTR bus long before). iio-sensor-proxy looks for its sensors once: started too
# early it exits, or stays up with only the sensors that were there.
[Unit]
ConditionPathIsDirectory=/usr/share/qcom/kaanapali/OnePlus/iceland/sensors/registry
Wants=hexagonrpcd-adsp-sensorspd.service
# the holder keeps the accelerometer streaming whenever this service runs (the cameras' bus needs it);
# it is bound to this unit, so it stops with it and this line starts it again with it
Wants=iceland-ssc-hold.service
After=hexagonrpcd-adsp-sensorspd.service
StartLimitIntervalSec=120
StartLimitBurst=15

[Service]
ExecStartPre=-/usr/libexec/iceland/iceland-ssc-wait 30 /usr/bin/ssccli
TimeoutStartSec=180
Restart=always
RestartSec=4
