<?xml version="1.0" encoding="UTF-8"?> <!-- -*- XML -*- -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- iceland-device: the bypass charging switch (iceland-bypassd). Only root owns the name; anyone may call it, the
     service checks every change with polkit (org.iceland.bypass.set). -->
<busconfig>
  <policy user="root">
    <allow own="org.iceland.Bypass"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.iceland.Bypass" send_interface="org.iceland.Bypass"/>
    <allow send_destination="org.iceland.Bypass" send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.iceland.Bypass" send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
