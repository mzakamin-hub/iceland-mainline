# iceland-device 0.28-29 (GAPS-2026-10-18 P-3): /usr/lib/systemd/system/irqbalance.service.d/iceland.conf
# irqbalance asks /usr/libexec/iceland/iceland-irqbalance-policy about every interrupt; it bans the display (MDSS)
# and GPU interrupts by name, so they stay on CPU 0 where kernel patch 0335's latency request is. Fedora's own
# command line is kept ($IRQBALANCE_ARGS from /usr/lib/irqbalance/irqbalance.env and /etc/sysconfig/irqbalance).
# 0.28-32 (optimization scan A2, 22 Oct): IRQBALANCE_BANNED_CPULIST=6-7 keeps device interrupts (Wi-Fi data path,
# UFS queues) off the prime cores; a value in /etc/sysconfig/irqbalance overrides it (EnvironmentFile wins). The policy
# script runs only with the SELinux module iceland_irqbalance (irqbalance_t may execute it).
# 0.28-33: only notices and above reach the journal (irqbalance logged ~308 "IRQ n guessed as class 0" info lines at
# every start); a drop-in in /etc/systemd/system/irqbalance.service.d/ with LogLevelMax=info brings them back.
[Service]
LogLevelMax=notice
Environment=IRQBALANCE_BANNED_CPULIST=6-7
ExecStart=
ExecStart=/usr/sbin/irqbalance $IRQBALANCE_ARGS --policyscript=/usr/libexec/iceland/iceland-irqbalance-policy
