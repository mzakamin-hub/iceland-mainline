# iceland-device: speaker protection for the OnePlus Pad 4 (0.27; loudness 0.28-3). Adapted from tb323fu-linux
# userspace/platform/pipewire/pipewire.conf.d/60-tb323fu-speakers.conf (MIT, Joonhoe Kim and contributors).
#
# The rule (owner, 12 Oct 2026): never LOUDER than stock's measured loudness. The amplifiers and the DSP stream stay at
# their stock settings (the UCM Speaker device pins "stream0.vol_ctrl0 MultiMedia1 Playback Volu" to 8192 = 0 dB = the
# topology's cap = stock's stream ceiling, HiFi.conf; the kernel keeps the six amplifiers at stock). Stock is louder than
# a level-only chain because its DSP compresses and then adds make-up gain: the peak ceiling is the same, the average
# level is near full scale. This chain does the same, with a make-up gain capped by the measured gap to stock
# (Android reference, wf/sound/android-ref.sh; tests/stock_loudness.json holds the cap and its basis):
#   1. high-pass 150 Hz (4th order: two Butterworth biquads, Q 0.541 / 1.307) per channel: the small speakers cannot
#      reproduce it; it only costs power and cone excursion (0.27r4: was 120 Hz 2nd order; kit 135 owner: "a bit
#      clipped"; 120 Hz is a later, separate retest)
#   2. compressor (RMS/peak 0.5, 2.5:1 over -24 dBFS, knee 8 dB) with make-up gain 9 dB (0.28-3; tb323fu: +8 dB;
#      0.27 - 0.28-2 had 0 dB and were far quieter than stock: r138b / r139b)
#   3. look-ahead limiter, input gain 0 dB, limit -1 dBFS, release 250 ms (0.28-3, tb323fu's -1 dBFS; was -3 / -3 dB;
#      0.27r4: a 50 ms release modulated the gain inside a bass cycle - audible distortion): peaks stay 1 dB below full
#      scale, so the DSP and the amplifiers never see more than stock's own ceiling
# Sink "Speakers" (effect_input.speakers) is the default output (iceland-speaker-default sets it as the configured
# default unless the user chose another output); the plain ALSA speaker sink stays as "Speakers (raw, unprotected)" with
# a low session priority (wireplumber.conf.d/62-iceland-speaker-raw.conf). Session priority 1000: below the microphones
# (raw 1712, processed 2000) - WirePlumber also considers a sink's monitor as a capture source (tb323fu: at 2000
# recordings went silent).
#   - Fail-safe: flags ifexists + nofail. Without the LADSPA plugins (ladspa-swh-plugins: sc4_1882,
#     fast_lookahead_limiter_1913) the module is skipped and the direct speaker sink is the only (default) speaker.
#   - The playback stream is passive: the speaker path is opened only while something plays.
# Turning it off: a drop-in with the one line
#     context.properties = { iceland.speaker-protection = false }
# in /etc/pipewire/pipewire.conf.d/ (every account) or ~/.config/pipewire/pipewire.conf.d/ (one account), then
# systemctl --user restart pipewire (or log in again).
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        # off when a drop-in sets context.properties = { iceland.speaker-protection = false } (see above)
        condition = [ { iceland.speaker-protection = !false } ]
        args = {
            node.description = "Speakers"
            media.name       = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpL label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.541 } }
                    { type = builtin name = hpR label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.541 } }
                    { type = builtin name = hpL2 label = bq_highpass control = { "Freq" = 150.0 "Q" = 1.307 } }
                    { type = builtin name = hpR2 label = bq_highpass control = { "Freq" = 150.0 "Q" = 1.307 } }
                    { type = ladspa name = comp plugin = sc4_1882 label = sc4
                        control = {
                            "RMS/peak" = 0.5
                            "Attack time (ms)" = 10
                            "Release time (ms)" = 200
                            "Threshold level (dB)" = -24
                            "Ratio (1:n)" = 2.5
                            "Knee radius (dB)" = 8
                            "Makeup gain (dB)" = 9
                        }
                    }
                    { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)" = 0
                            "Limit (dB)" = -1
                            "Release time (s)" = 0.25
                        }
                    }
                ]
                links = [
                    { output = "hpL:Out"           input = "hpL2:In" }
                    { output = "hpR:Out"           input = "hpR2:In" }
                    { output = "hpL2:Out"          input = "comp:Left input" }
                    { output = "hpR2:Out"          input = "comp:Right input" }
                    { output = "comp:Left output"  input = "lim:Input 1" }
                    { output = "comp:Right output" input = "lim:Input 2" }
                ]
                inputs  = [ "hpL:In" "hpR:In" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.speakers"
                media.class      = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
            }
            playback.props = {
                node.name         = "effect_output.speakers"
                node.passive      = true
                # the UCM speaker sink of the Pad 4 (alsa_output.<card>.HiFi__<UCM device>__sink)
                target.object     = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.dont-fallback = true
                node.linger       = true
                stream.dont-remix = true
            }
        }
    }
]
