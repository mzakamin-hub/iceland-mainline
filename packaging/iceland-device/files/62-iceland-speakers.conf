# iceland-device: speaker protection for the OnePlus Pad 4 (0.27). Adapted from tb323fu-linux
# userspace/platform/pipewire/pipewire.conf.d/60-tb323fu-speakers.conf (MIT, Joonhoe Kim and contributors), with the
# loudness parts removed: this chain only ever takes level away.
#
# The hard ceiling is stock's: the UCM Speaker device pins the DSP stream gain to 0 dB (HiFi.conf,
# "stream0.vol_ctrl0 MultiMedia1 Playback Volu" 8192 = the topology's cap = stock's stream ceiling; 0.27r6, was the
# -12 dB placeholder 2056) after this chain, so nothing here can make the speakers louder than stock. The chain:
#   1. high-pass 150 Hz (4th order: two Butterworth biquads, Q 0.541 / 1.307) per channel: the small speakers cannot
#      reproduce it; it only costs power and cone excursion (0.27r4: was 120 Hz 2nd order; kit 135 owner: "a bit
#      clipped")
#   2. gentle compressor (RMS/peak 0.5, 2.5:1 over -24 dBFS, knee 8 dB), makeup gain 0 dB (theirs: +8 dB - NOT taken)
#   (0.27r6: the slow RMS cap - 10:1 over -16 dBFS - is gone: one limiting stage, owner 11 Oct 2026; r138b measured
#   the speakers far quieter than stock)
#   3. look-ahead limiter, input gain -3 dB (headroom), limit -3 dBFS, release 250 ms (0.27r4: a 50 ms release
#      modulated the gain inside a bass cycle - audible distortion): peaks stay 3 dB below full scale
# Every stage has a gain of at most 0 dB.
# Sink "Speakers" (effect_input.speakers) is the default output; the plain ALSA speaker sink stays usable as
# "Speakers (direct, no protection filter)" with a low session priority (wireplumber.conf.d/62-iceland-speaker-raw.conf),
# so it is never picked as the default while this sink exists. Session priority 1000: below the microphones (raw 1712,
# processed 2000) - WirePlumber also considers a sink's monitor as a capture source (tb323fu: at 2000 recordings went
# silent).
#   - Fail-safe: flags ifexists + nofail. Without the LADSPA plugins (ladspa-swh-plugins: sc4_1882,
#     fast_lookahead_limiter_1913) the module is skipped and the direct speaker sink is the only (default) speaker.
#   - The playback stream is passive: the speaker path is opened only while something plays.
# Turning it off: a drop-in with the one line
#     context.properties = { iceland.speaker-protection = false }
# in /etc/pipewire/pipewire.conf.d/ (every account) or ~/.config/pipewire/pipewire.conf.d/ (one account), then
# systemctl --user restart pipewire (or log in again).
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        # off when a drop-in sets context.properties = { iceland.speaker-protection = false } (see above)
        condition = [ { iceland.speaker-protection = !false } ]
        args = {
            node.description = "Speakers"
            media.name       = "Speakers"
            filter.graph = {
                nodes = [
                    { type = builtin name = hpL label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.541 } }
                    { type = builtin name = hpR label = bq_highpass control = { "Freq" = 150.0 "Q" = 0.541 } }
                    { type = builtin name = hpL2 label = bq_highpass control = { "Freq" = 150.0 "Q" = 1.307 } }
                    { type = builtin name = hpR2 label = bq_highpass control = { "Freq" = 150.0 "Q" = 1.307 } }
                    { type = ladspa name = comp plugin = sc4_1882 label = sc4
                        control = {
                            "RMS/peak" = 0.5
                            "Attack time (ms)" = 10
                            "Release time (ms)" = 200
                            "Threshold level (dB)" = -24
                            "Ratio (1:n)" = 2.5
                            "Knee radius (dB)" = 8
                            "Makeup gain (dB)" = 0
                        }
                    }
                    { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)" = -3
                            "Limit (dB)" = -3
                            "Release time (s)" = 0.25
                        }
                    }
                ]
                links = [
                    { output = "hpL:Out"           input = "hpL2:In" }
                    { output = "hpR:Out"           input = "hpR2:In" }
                    { output = "hpL2:Out"          input = "comp:Left input" }
                    { output = "hpR2:Out"          input = "comp:Right input" }
                    { output = "comp:Left output"  input = "lim:Input 1" }
                    { output = "comp:Right output" input = "lim:Input 2" }
                ]
                inputs  = [ "hpL:In" "hpR:In" ]
                outputs = [ "lim:Output 1" "lim:Output 2" ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name        = "effect_input.speakers"
                media.class      = Audio/Sink
                priority.session = 1000
                priority.driver  = 1000
            }
            playback.props = {
                node.name         = "effect_output.speakers"
                node.passive      = true
                # the UCM speaker sink of the Pad 4 (alsa_output.<card>.HiFi__<UCM device>__sink)
                target.object     = "alsa_output.platform-sound.HiFi__Speaker__sink"
                node.dont-fallback = true
                node.linger       = true
                stream.dont-remix = true
            }
        }
    }
]
