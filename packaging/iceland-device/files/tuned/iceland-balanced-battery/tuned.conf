# iceland-device: GNOME power mode "Balanced" while on battery (tuned-ppd's [battery] mapping).
# Stock keeps the same CPU/GPU DCVS on battery; the screen-side saving (60 Hz) is done by iceland-refresh.
[main]
summary=OnePlus Pad 4: balanced on battery - balanced's DCVS, slower schedutil updates; 60 Hz from iceland-refresh
include=iceland-balanced

# 0.28-34: schedutil rate limit 2 ms on battery (1 ms in balanced); UFS auto-hibern8 10 ms comes from balanced.
# ([video] panel_power_savings went: an amdgpu setting, nothing on this tablet)
[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/schedutil/rate_limit_us=2000
/sys/devices/system/cpu/cpufreq/policy6/schedutil/rate_limit_us=2000
