# iceland-device: GNOME power mode "Performance" on the OnePlus Pad 4.
# Still schedutil (stock never pins the CPUs, and a pinned "performance" governor only adds heat). This mode adds:
#  - stock's full range: the big cluster's two turbo steps, 4512000 and 4608000 kHz (stock's 6.12 SCMI driver
#    switches boost on at start and its boot script writes 4608000 kHz as the big cluster's maximum; mainline keeps
#    turbo off until /sys/devices/system/cpu/cpufreq/boost is 1);
#  - (govtune) stock's performance-mode floors: perfboostsconfig.xml hint 0x00001091 "Performance mode" (enabled
#    for canoe) sets CPUBOOST_MIN_FREQ 0x6F9 = 1785 MHz on the small and 0x699 = 1689 MHz on the big cluster; the
#    tables give 1785600 and 1747200 kHz (the kernel rounds up to the next step, as stock's perf HAL does).
# The CPU, skin and XO thermal zones and iceland-thermal's gear caps limit every frequency as before (a floor above
# a cap gives way to the cap). GPU DCVS uncapped.
[main]
summary=OnePlus Pad 4: performance - stock's full range with the turbo steps and stock's performance-mode floors
include=iceland-balanced

[cpu]
priority=10
governor=schedutil
boost=1

[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=1785600
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=1747200
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3628800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4608000
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=1200000000
/sys/devices/system/cpu/cpufreq/boost=1
