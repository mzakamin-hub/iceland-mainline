# iceland-device: GNOME power mode "Performance" on the OnePlus Pad 4.
# Still schedutil with stock's floors (stock never pins the CPUs, and a pinned "performance" governor only adds
# heat). What this mode adds is stock's full range: the big cluster's two turbo steps, 4512000 and 4608000 kHz. Stock
# runs with them (its 6.12 SCMI cpufreq driver switches boost on at start, and its boot scripts write 4608000 kHz as
# the big cluster's maximum); mainline keeps turbo frequencies off until /sys/devices/system/cpu/cpufreq/boost is 1.
# The CPU, skin and XO thermal zones limit them like every other frequency. GPU DCVS uncapped.
[main]
summary=OnePlus Pad 4: performance - stock's full range with the big cluster's turbo steps, no pinning
include=iceland-balanced

[cpu]
priority=10
governor=schedutil
boost=1

[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=787200
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=864000
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3628800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4608000
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=1200000000
/sys/devices/system/cpu/cpufreq/boost=1
