# iceland-device: GNOME power mode "Performance" on the OnePlus Pad 4.
# Still schedutil (stock never pins the CPUs; area-graphics-1 showed the GPU already runs at 1.2 GHz under load and
# reaches 103 C, so a pinned "performance" governor would only add heat): the floors go to stock's higher fallback
# pair (787200 / 864000 kHz), the range stays full, boost on, GPU DCVS uncapped.
[main]
summary=OnePlus Pad 4: performance - stock's higher frequency floors, full range, no pinning
include=iceland-balanced

[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=787200
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=864000
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3628800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4396800
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=1200000000
