# iceland-device: GNOME power mode "Balanced" on the OnePlus Pad 4 (tuned-ppd maps it here).
# CPU: schedutil with the frequency floors stock's own schedutil fallback uses (init.kernel.post_boot: 614400 kHz on
# the small cluster, 864000 on the big one) and the full stock range above them. GPU: the kernel's DCVS over the
# stock level table, uncapped. The RT utilisation clamp is released as stock does.
[main]
summary=OnePlus Pad 4: balanced - stock frequency floors, full range, GPU DCVS uncapped
include=balanced

[cpu]
priority=10
governor=schedutil
boost=1

[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=614400
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=864000
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3628800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4396800
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=1200000000

[sysctl]
kernel.sched_util_clamp_min_rt_default=0
