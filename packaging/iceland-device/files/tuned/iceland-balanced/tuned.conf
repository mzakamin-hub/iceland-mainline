# iceland-device: GNOME power mode "Balanced" on the OnePlus Pad 4 (tuned-ppd maps it here).
# CPU: schedutil with the frequency floors stock sets at boot on this SoC revision (2.0): 787200 kHz on the small
# cluster and 864000 kHz on the big one (init.kernel.post_boot-canoe_default_6_2.sh, the branch for revisions other
# than 1.0 / 1.1; the kernel rounds 864000 up to the next table step, 883200, as on stock). The range ends at the
# highest sustained frequencies, 3628800 / 4396800 kHz: the big cluster's two turbo steps stay off in this mode (the
# kernel's default; "Performance" turns them on). GPU: the kernel's DCVS over the stock level table, uncapped. The RT
# utilisation clamp is released as stock does.
[main]
summary=OnePlus Pad 4: balanced - stock frequency floors, sustained range, GPU DCVS uncapped
include=balanced

[cpu]
priority=10
governor=schedutil
boost=0

[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=787200
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=864000
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3628800
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=4396800
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=1200000000
# 0.28-34 (POWER-ROUND-2): schedutil changes the frequency at most every 1 ms (the kernel's 45 us = 1.5 x the
# 30 us SCMI transition latency; 1 ms is the kernel's default for a driver without one; stock's WALT decides once
# per 16 ms window). The UFS link enters hibern8 after 10 ms idle instead of the core's 150 ms.
/sys/devices/system/cpu/cpufreq/policy0/schedutil/rate_limit_us=1000
/sys/devices/system/cpu/cpufreq/policy6/schedutil/rate_limit_us=1000
/sys/devices/platform/soc@0/1d84000.ufs/auto_hibern8=10000

[sysctl]
kernel.sched_util_clamp_min_rt_default=0
