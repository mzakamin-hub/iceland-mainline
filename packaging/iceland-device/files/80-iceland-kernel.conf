# iceland-device: what dnf (and with it GNOME Software, which uses the same library through dnf5daemon) must never
# install on the OnePlus Pad 4, from any repository. Replaces the six-name list of iceland-device 0.16.
#
# 1. Fedora's kernels have no Pad 4 support; kernel-iceland (our repository) is the only kernel. Exact names and
#    narrow globs on purpose: "kernel*" would also freeze kernel-headers (needed by glibc-devel / gcc) and
#    kernel-tools (installed), and would hide kernel-iceland itself.
# 2. Nothing may rebuild an initramfs or add boot entries for a kernel that is not ours: the rescue-image and
#    generic-image switches of dracut (dracut itself stays: kernel-iceland's own initramfs is built with it), and
#    the tools that build kernel modules for Fedora's kernels (akmods, dkms).
# 3. Nothing may write boot code: fwupd's EFI capsule binaries (U-Boot is not a firmware target), other boot
#    loaders and boot-loader updaters, U-Boot images for other boards.
# excludepkgs, protected_packages and installonlypkgs are append lists in libdnf5 (OptionStringAppendList): the
# values of this file are ADDED to those of other configuration files, they do not replace them.
# Held packages that ARE installed (0.28-4: our sensor programs, alsa-ucm, our own names) are handled per repository in
# /usr/share/dnf5/repos.override.d/50-iceland-fedora-hold.repo.
[main]
excludepkgs=kernel,kernel-core,kernel-modules*,kernel-uki-*,kernel-debug*,kernel-devel*,kernel-64k*,kernel-16k*,kernel-rt*,dracut-config-rescue,dracut-config-generic,akmods,akmod-*,dkms,kmodtool,fwupd-efi,fwupd-plugin-uefi-capsule-data,bootupd,sdubby,systemd-boot-unsigned,shim-unsigned-*,uboot-images-*
# dnf refuses to remove these: the device package (kernel-iceland is covered through it: iceland-device requires it,
# and dnf never removes the running kernel) and the two files U-Boot starts from the EFI partition. kernel-iceland is
# NOT listed itself: dnf must stay able to drop the oldest of the kept kernel versions.
protected_packages=iceland-device,grub2-efi-aa64,shim-aa64
# kernel-iceland versions are installed side by side (installonly_limit, default 3, keeps the last three)
installonlypkgs=kernel-iceland
# 0.24: an update that cannot be resolved because of the holds above / in 50-iceland-fedora-hold.repo is skipped,
# the rest of the transaction goes ahead (for dnf, dnf5daemon and GNOME Software alike: they all read this file).
# Example: Fedora's pipewire-plugin-libcamera built against a newer libcamera soname than the held one; all PipeWire
# sub-packages require pipewire-libs of the exact version-release, so the whole PipeWire set stays at the installed
# version until the matching libcamera comes through the local repository.
# best=False: an upgrade may stop below the newest version when the newest cannot be installed (libdnf5's default is
#   True = take the newest or fail; Fedora's own 20-fedora-defaults.conf already sets False - repeated here so the
#   tablet does not depend on it; this file is read after it).
# skip_broken=True: packages that cannot be installed are left out of the transaction instead of failing the whole
#   resolve (also for named upgrades, "dnf upgrade pipewire", and for a list of packages GNOME Software hands over).
# skip_unavailable stays False (its default): it only concerns package names that match nothing and would hide typos.
# What waits: iceland-update-check (read-only).
best=False
skip_broken=True
