# iceland-device: /usr/lib/systemd/system/hexagonrpcd-adsp-sensorspd.service.d/iceland.conf
# hexagonrpcd serves the ADSP's sensors PD its files: the tablet's own sensor configs, registry and /vendor/dsp,
# taken from the tablet's partitions at install time into /usr/share/qcom/kaanapali/OnePlus/iceland (private,
# never shipped). Without that tree the unit does not start. udev starts it when /dev/fastrpc-adsp appears
# (81-iceland-ssc.rules); the upstream unit's WantedBy=multi-user.target would miss a late node.
# It has to run early: the sensor hub stops asking for its files a few minutes after the ADSP has started.
[Unit]
ConditionPathIsDirectory=/usr/share/qcom/kaanapali/OnePlus/iceland/sensors/registry
Before=iio-sensor-proxy.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/kaanapali/OnePlus/iceland
# every test so far ran it as root (the sensor hub also writes below its registry directory); the upstream unit's
# "fastrpc" user is created by the hexagonrpc package and can be used once the tree's ownership is settled
User=root
Group=root
