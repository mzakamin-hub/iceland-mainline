# iceland-device: /usr/lib/systemd/system/hexagonrpcd-adsp-sensorspd.service.d/iceland.conf
# hexagonrpcd serves the ADSP's sensors PD its files: the tablet's own sensor configs, registry and /vendor/dsp,
# taken from the tablet's partitions at install time into /usr/share/qcom/kaanapali/OnePlus/iceland (private,
# never shipped). Without that tree the unit does not start. udev starts it when /dev/fastrpc-adsp appears
# (81-iceland-ssc.rules); the upstream unit's WantedBy=multi-user.target would miss a late node.
# It has to run early: the sensor hub stops asking for its files a few minutes after the ADSP has started.
#
# It runs as the upstream unit's user "fastrpc" (hexagonrpc's sysusers.d); hexagonrpc's 60-hexagonrpc.rules gives
# /dev/fastrpc-* the group fastrpc, mode 0660. hexagonrpcd only READS: it refuses every open for writing
# (hexagonrpcd/apps_std.c, apps_std_fopen_with_env: mode 'w' / 'a' -> AEE_EUNSUPPORTED, logged as "Tried to open ...
# for writing" - the registry's own write attempts end there on every kernel so far), and the tree it serves is a
# read-only view (hexagonfs). The tree stays root's, readable by group fastrpc (tmpfiles.d/iceland-dsp-tree.conf:
# stock's registry files are 0600); the service gets no writable path, no capability and no network.
[Unit]
ConditionPathIsDirectory=/usr/share/qcom/kaanapali/OnePlus/iceland/sensors/registry
Before=iio-sensor-proxy.service
# the tree's group fastrpc comes from iceland-dsp-tree.conf (tmpfiles, Z): set before the first start
After=systemd-tmpfiles-setup.service

[Service]
ExecStart=
ExecStart=/usr/bin/hexagonrpcd -f /dev/fastrpc-adsp -d adsp -s -R /usr/share/qcom/kaanapali/OnePlus/iceland
User=fastrpc
Group=fastrpc
# hardening (plan item 6, 3 Oct 2026): nothing to gain, a read-only system, only its own device node
NoNewPrivileges=yes
CapabilityBoundingSet=
AmbientCapabilities=
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
PrivateNetwork=yes
RestrictAddressFamilies=AF_UNIX
DevicePolicy=closed
DeviceAllow=/dev/fastrpc-adsp rw
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
SystemCallArchitectures=native
UMask=0077
