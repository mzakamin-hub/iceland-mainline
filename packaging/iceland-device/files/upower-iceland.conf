# iceland-device: /usr/lib/systemd/system/upower.service.d/iceland.conf
# UPower reads the battery's charge-limit thresholds (udev property CHARGE_LIMIT, from 61-iceland-battery.hwdb)
# once, when it first sees the battery. Started before udev has processed the battery it reports the charge limit
# as not supported and GNOME hides "Battery Charging" until UPower is restarted (area-combo-37, -40).
# Wait for udev's first device scan.
[Unit]
Wants=systemd-udev-settle.service
After=systemd-udev-settle.service
