# iceland-device: /usr/lib/systemd/system/upower.service.d/iceland.conf
# UPower reads the battery's charge-limit thresholds (udev property CHARGE_LIMIT, from 61-iceland-battery.hwdb)
# once, when it first sees the battery. Started before udev has processed the battery it reports the charge limit
# as not supported and GNOME hides "Battery Charging" until UPower is restarted (area-combo-37, -40).
# 0.28-27 (OPTIMIZATION-DELTA-2026-10-18 D3): wait for exactly that, the battery's device unit, which
# 70-iceland-battery-ready.rules creates only when udev has the CHARGE_LIMIT property; up to 0.28-26 this drop-in
# pulled in systemd-udev-settle (all devices), which held sysinit.target ~1.5 s at every boot. Wants= gives the
# device a start job (systemd's device timeout, 90 s): without the battery UPower still starts, only later.
[Unit]
Wants=sys-subsystem-power_supply-devices-iceland_battery.device
After=sys-subsystem-power_supply-devices-iceland_battery.device
