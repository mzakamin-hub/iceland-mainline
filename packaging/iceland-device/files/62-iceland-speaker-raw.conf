# iceland-device: the plain ALSA speaker sink of the OnePlus Pad 4 bypasses the protecting "Speakers" filter chain
# (pipewire.conf.d/62-iceland-speakers.conf): name it so and keep it from ever being picked as the default output
# (0.28-3: tb323fu's name; iceland-speaker-default also moves a configured default away from it). Its level is still
# capped by the kernel / UCM (the DSP stream at stock's 0 dB, the amplifiers at stock). It is not hidden: the filter
# chain plays into it, and hiding it from clients (WirePlumber's node.software-dsp hide-parent) would also hide its
# monitor from the loopback test. Adapted from tb323fu-linux 60-tb323fu-speaker-raw.conf (MIT).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        node.description = "Speakers (raw, unprotected)"
        priority.session = 100
      }
    }
  }
]
