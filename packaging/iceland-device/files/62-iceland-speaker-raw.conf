# iceland-device: the plain ALSA speaker sink of the OnePlus Pad 4 bypasses the protecting "Speakers" filter chain
# (pipewire.conf.d/62-iceland-speakers.conf, 0.27): name it so and keep it from being picked as the default output.
# Its level is still capped by the kernel / UCM (-12 dB DSP stream gain). Adapted from tb323fu-linux
# 60-tb323fu-speaker-raw.conf (MIT).
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = {
      update-props = {
        node.description = "Speakers (direct, no protection filter)"
        priority.session = 100
      }
    }
  }
]
