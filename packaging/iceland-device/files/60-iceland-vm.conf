# iceland-device 0.28-9: no proactive memory compaction, as on stock OxygenOS 11.A.38, which writes 0 at every boot
# (vendor/bin/init.kernel.post_boot-memory.sh: "Disable periodic kcompactd wakeups"; odm/bin/init.oplus.mm-vnd.sh
# and odm/etc/init.oplus.mm-sys.sh again). Fedora's kernel default 20 woke kcompactd every 500 ms to keep memory
# defragmented for huge pages: kcompactd took 4.7 % CPU in the owner's 10.7 W measurement (field report 14 Oct).
# Compaction on demand (an allocation that needs it, kswapd) is unchanged. A file of the same name in /etc/sysctl.d
# overrides this one.
vm.compaction_proactiveness = 0
