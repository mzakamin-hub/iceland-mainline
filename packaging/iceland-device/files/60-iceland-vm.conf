# iceland-device 0.28-9: no proactive memory compaction, as on stock OxygenOS 11.A.38, which writes 0 at every boot
# (vendor/bin/init.kernel.post_boot-memory.sh: "Disable periodic kcompactd wakeups"; odm/bin/init.oplus.mm-vnd.sh
# and odm/etc/init.oplus.mm-sys.sh again). Fedora's kernel default 20 woke kcompactd every 500 ms to keep memory
# defragmented for huge pages: kcompactd took 4.7 % CPU in the owner's 10.7 W measurement (field report 14 Oct).
# Compaction on demand (an allocation that needs it, kswapd) is unchanged. A file of the same name in /etc/sysctl.d
# overrides this one.
vm.compaction_proactiveness = 0

# iceland-device 0.28-45: swap settings for zram. The only swap is zram (zram-generator, zstd, up to 8 GB in RAM), so
# swapping a page out costs a compression and reading it back a decompression, both cheaper than dropping file pages
# that must be read again from the UFS. The kernel's defaults are tuned for a disk:
# - vm.swappiness 60 -> 180: swap anonymous memory before the page cache of the running apps (values above 100 are
#   meant for in-memory swap; Fedora's own zram documentation and other phone ports use 180).
# - vm.page-cluster 3 -> 0: read back one page at a time; read-ahead of 8 pages helps a disk, with zram it only
#   decompresses pages nobody asked for.
# - vm.watermark_boost_factor 15000 -> 0: no extra reclaim after fragmentation events (it made short reclaim storms).
# - vm.watermark_scale_factor 10 -> 125: kswapd starts earlier (about 1.25 % of RAM free instead of 0.1 %), so an app
#   rarely waits for memory itself (direct reclaim).
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
