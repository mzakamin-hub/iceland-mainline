# iceland-device: system services on the small cores (cpu0-5), as stock confines its background and
# system-background cpusets to 0-5 (init.kernel.post_boot-canoe_default_6_2.sh: "echo 0-5 > /dev/cpuset/background/cpus",
# ".../system-background/cpus"). The GNOME session and the user's apps (user.slice) keep all eight cores.
# Installed as /usr/lib/systemd/system/system.slice.d/50-iceland-system-cpus.conf.
[Slice]
AllowedCPUs=0-5
