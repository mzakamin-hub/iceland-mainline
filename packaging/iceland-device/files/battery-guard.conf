# iceland-battery-guard settings (read every few seconds, no restart needed). One line per setting.
# The stock charging limits themselves (temperature regions, voltages, currents, the USB-C connector rules, the
# power-off temperatures) are not settings: they are in /usr/libexec/iceland/iceland-battery-guard, each with its
# stock source.
#
# Charge limit: charging stops at CHARGE_LIMIT percent and starts again at or below CHARGE_RESUME percent.
# Keeps the battery below full for a longer battery life. CHARGE_LIMIT=100 (or 0) turns it off.
#
# These two lines are only used on a kernel WITHOUT its own charge limit. With kernel-iceland's limit
# (/sys/class/power_supply/qcom-battmgr-bat/charge_control_end_threshold) the limit is the switch in
# GNOME Settings > Power > Battery Charging ("Preserve Battery Health" = stop at 85 %, start again below 80 %,
# /usr/lib/udev/hwdb.d/61-iceland-battery.hwdb), and the guard follows the kernel's thresholds as a second layer.
# The package turns that switch on once, at its first installation (the 85 % limit was always on before 0.17).
CHARGE_LIMIT=85
CHARGE_RESUME=80
#
# Where the limit comes from: "kernel" = the kernel's thresholds when the kernel has them (GNOME's switch decides),
# the two lines above otherwise. "conf" = always the two lines above, whatever GNOME's switch says (as before 0.17).
LIMIT_SOURCE=kernel
#
# Awake while a charger is in: the tablet does not suspend by itself (idle, power key, lid) while a charger is
# connected, as on stock, so that this guard keeps watching the charge; the screen still blanks, and
# "systemctl suspend -i" still suspends. KEEP_AWAKE=0 lets it suspend on a charger: charging is then left to the
# charger firmware alone until the tablet wakes up (no temperature regions, no connector rules, no charge limit).
KEEP_AWAKE=1
#
# The cover with a charger in (owner's choice; wf/wake recommends "auto"): "auto" = the guard blocks sleep only
# while logind merely locks a closing cover with a charger in (the package's logind.conf.d/60-iceland.conf:
# HandleLidSwitchExternalPower=lock): closing the cover locks the session and the screen goes dark, the tablet
# stays awake, and when the charger is pulled with the cover closed it suspends. If logind would sleep on a closing
# cover, or its setting can't be read, the guard blocks the lid switch as well. "yes" = the lid switch is always
# blocked while a charger is in: closing the cover does nothing (the screen stays on).
BLOCK_LID_SWITCH=auto
#
# The power key with a charger in (0.28-10): while sleep is blocked (above), the guard turns a short press of the
# power key into "lock and blank the screen", as stock turns the screen off while charging. A press while the screen
# is off or the screen saver is on only wakes the screen. POWER_KEY_BLANK=0: the guard does nothing with the key
# while a charger is in.
POWER_KEY_BLANK=1
#
# The power key without a charger (0.28-14): the guard is the power key's only handler (GNOME's own action is
# 'nothing' by the package's default, /usr/share/glib-2.0/schemas/zz_iceland-device.gschema.override): a short press
# suspends, as GNOME's "suspend" did (the session locks as it goes to sleep); while another program blocks sleep it
# locks and blanks the screen instead. A press while the screen is off, or right after the tablet woke up, only wakes
# the screen. POWER_KEY_SUSPEND=0: the guard does nothing without a charger. A power button action chosen in GNOME
# Settings > Power (anything but "Nothing") makes GNOME act on the key as well; the guard's journal line says so.
POWER_KEY_SUSPEND=1
#
# Thermal cap: the guard also takes the charge-current cap that iceland-thermal publishes for the present skin
# temperature gear (/run/iceland/thermal-fcc-ma); the smaller cap wins, the guard's own stock limits are never
# raised. THERMAL_CAP=0: that file is not read (the guard's own limits only, as before 0.17).
THERMAL_CAP=1
#
# Bypass charging (the "Bypass Charging" toggle in GNOME's Quick Settings, as stock's Settings > Battery > Bypass
# charging): with a charger in, charging stops at the chosen threshold and the tablet runs from the charger; the level
# is held within 1 %; it ends at unplug and 5 minutes after the toggle stops renewing it (screen locked, logged out).
# It can only stop charging: every limit above still applies. BYPASS=0: the toggle's requests are ignored.
BYPASS=1
#
# USB-C input cut: at a USB-C connector stop (too hot, far above the battery, warming fast) and at the input
# over-limit stop the guard also switches the charger input off through the kernel's lever
# (/sys/class/power_supply/qcom-battmgr-usb/input_current_limit = 0, kernel-iceland), as stock's connector
# protection does: the tablet then runs from its battery and nothing flows through the hot connector. The input
# comes back once the cable is out, the connector reads below 55 C (stock's recover rule) and no connector rule
# fires. The desktop shows the stop and its end (iceland-charge-alert). INPUT_SUSPEND=0: charging off only, as
# before 0.19. The guard never sets an input current of its own: the limit stays the kernel's stock value for the
# charger type.
INPUT_SUSPEND=1
