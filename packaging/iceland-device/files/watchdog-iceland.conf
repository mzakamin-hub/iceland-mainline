# iceland-device: /usr/lib/systemd/system.conf.d/60-iceland-watchdog.conf
# systemd feeds the SoC's hardware watchdog (qcom_wdt, "qcom,apss-wdt-kaanapali" at 0x17600000, /dev/watchdog0;
# module of kernel-iceland, also in the initramfs). A system that hangs so badly that PID 1 stops running resets
# after 30 s instead of staying frozen. The watchdog takes 31 s at most: one minute was refused ("Failed to set
# watchdog hardware timeout to 1min: Invalid argument", rehearsals R1d / R2), so the reboot watchdog is 30 s too.
# qcom_wdt stops the watchdog for a suspend and starts it again after the resume.
# The same values as every rehearsal since R2-final (written there by the rehearsal's initramfs into /run).
# Off: a drop-in in /etc/systemd/system.conf.d/ with RuntimeWatchdogSec=off (after the next boot).
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=30s
