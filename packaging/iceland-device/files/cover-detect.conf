# /etc/iceland/cover-detect.conf - iceland-cover-detect (iceland-device). KEY=VALUE; restart the service after a change:
#   sudo systemctl restart iceland-cover-detect
# ENABLE=no            turns the detector off (or: systemctl disable --now iceland-cover-detect)
# SOURCE=hall+mag      hall = the sensor hub's hall sensor only (stock's cover magnet position)
#                      mag  = proximity NEAR confirmed by a magnetometer step (covers whose magnet misses the hall)
#                      hall+mag (default): the hall decides once it has seen a magnet, proximity + field otherwise
# HALL_INVERT=no       yes if the hub reports "no magnet" while the cover is closed
# DEBUG=no             yes: field, step, proximity and state in the journal every 0.5 s
# CLOSE_UT=10          field step (uT) that confirms a NEAR proximity as a cover (BT keyboard cover: 18-27 uT)
# CLOSE_MAX_UT=50      a bigger step is a turn of the tablet (67-82 uT seen), not a cover
# OPEN_UT=8            open: field back to within max(OPEN_UT, step / 2) of the field before the close
# PROX_CLOSE_S=1.0     proximity NEAR and the step held this long = closed
# PROX_OPEN_S=1.0      proximity FAR this long + field back = open
# PROX_FAR_OPEN_S=5    proximity FAR this long = open whatever the field
# REF_FROM_S=6.0  REF_TO_S=2.5  STALL_S=10
ENABLE=yes
