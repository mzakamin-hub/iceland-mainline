# iceland-device (0.28-50): PipeWire clock domains of the OnePlus Pad 4 card, parts 1-2 of 3 of the fix for speaker
# crackle while a microphone is open (part 3, the 2048-frame minimum quantum: pipewire.conf.d/64-iceland-clock.conf).
# The audio DSP times the playback and the capture PCMs independently, and the capture PCM reports its delay in steps
# of a whole period (40 ms). When both run at once (our echo canceller records the microphone against the speaker
# monitor; a call; an input level meter while something plays) PipeWire makes one device follow the other. While both
# carried the same default clock name the follower was not rate-matched and PipeWire "resync"ed it at every step:
# audible crackle on the speakers.
#   1. the capture sources get a clock domain of their own -> a follower is rate-matched (adaptive resampling)
#      instead of hard-resynced; the internal microphones and the headset microphone share the one capture PCM
#      (hw:,2), so both get the same capture clock name;
#   2. the raw speaker sink is preferred as the graph driver (priority.driver 3000, above every other node of ours:
#      Speakers chain 1000, processed microphone 2000), so playback never follows the capture clock.
# Session priorities (which device is the default) are not changed. The echo canceller keeps working: it is a
# node inside the same graph; its capture side now runs through PipeWire's rate matching like any follower.
# Measured by jstockdale on the same card: 51 resyncs per 3 min before; 0 in 34 s with the mic held open after all
# three parts.
#
# Adapted from jstockdale/ubuntu-oneplus-pad-4 packaging/ubuntu-iceland-device/usr/share/wireplumber/
# wireplumber.conf.d/64-iceland-clocks.conf (commit 56624238), BSD-3-Clause:
#   Copyright (c) 2026, the Ubuntu OnePlus Pad 4 (iceland) port contributors. Redistribution and use in source and
#   binary forms, with or without modification, are permitted provided that the conditions of the BSD 3-Clause
#   License are met (retain this notice; no endorsement by the names of the contributors). THIS SOFTWARE IS PROVIDED
#   "AS IS" WITHOUT ANY WARRANTY. Full text: /usr/share/licenses/iceland-device/LICENSE.BSD-3-Clause.ubuntu-iceland
# Change from theirs: the headset microphone source (HiFi__Headset__source, our UCM's second capture device) is
# matched too.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_input.platform-sound.HiFi__Mic__source" }
      { node.name = "alsa_input.platform-sound.HiFi__Headset__source" }
    ]
    actions = { update-props = { clock.name = "api.alsa.0.capture" } }
  }
  {
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
    actions = { update-props = { priority.driver = 3000 } }
  }
]
