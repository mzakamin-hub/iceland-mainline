# iceland-device 0.28-27 (AUDIT-2026-10-18 U4): /usr/lib/systemd/system/iio-sensor-proxy.service.d/iceland-watch.conf
# The sensor watch is event-driven: when the proxy becomes inactive after a clean stop (OnSuccess=) or fails for good
# (OnFailure=: the start limit of iceland.conf hit, or the 3 s stop timeout of iceland-sleep.conf at a suspend), the
# one-shot iceland-ssc-watch.timer is armed and iceland-ssc-watch checks 90 s later (the same rules as before: nothing
# when the proxy runs again, a job is queued, the unit is masked or /run/iceland/sensors-off exists; at most 5
# starts per boot). Restart=always's own restarts trigger neither. JobMode=fail: the arming never displaces another
# job (e.g. at shutdown the timer's start just fails).
[Unit]
OnSuccess=iceland-ssc-watch.timer
OnSuccessJobMode=fail
OnFailure=iceland-ssc-watch.timer
OnFailureJobMode=fail
