# iceland-device: /usr/lib/tmpfiles.d/iceland-dsp-tree.conf
# The sensor hub's file tree (the tablet's own registry, configs and /vendor/dsp, extracted at install time) keeps
# stock's modes: the saved registry / calibration files are 0600 root. hexagonrpcd runs as the user fastrpc (it only
# reads), so the tree goes to group fastrpc at every boot: directories 0750, files 0640 (~ keeps the missing x bits
# of the files), nothing for others.
Z /usr/share/qcom/kaanapali/OnePlus/iceland ~0750 root fastrpc -
