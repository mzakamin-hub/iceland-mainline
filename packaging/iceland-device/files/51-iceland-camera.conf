# /usr/share/wireplumber/wireplumber.conf.d/51-iceland-camera.conf (iceland-device)
#
# The cameras of the OnePlus Pad 4 reach the desktop through libcamera (two PipeWire sources, "Built-in Back
# Camera" and "Built-in Front Camera"). WirePlumber's plain V4L2 monitor also lists every raw video node of the
# Qualcomm camera subsystem as a device (16 entries "Qualcomm Camera Subsystem"). They cannot be used as cameras
# without libcamera: keep them out of the device list.
#
# The match must use a property of the udev monitor: WirePlumber applies these rules before it opens the device
# (src/scripts/monitors/v4l2/create-device.lua), and api.v4l2.cap.* only exist after that. The first version
# matched api.v4l2.cap.driver and did nothing (area-combo-49 / -52: 19 V4L2 devices with and without it).
# device.bus-path is udev's ID_PATH of the camera subsystem (WirePlumber names these devices
# "v4l2_device.platform-9253000.isp"); the video decoder / encoder (platform-2000000.video-codec) are not touched.
monitor.v4l2.rules = [
  {
    matches = [
      { device.bus-path = "platform-9253000.isp" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
