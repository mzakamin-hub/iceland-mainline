# /usr/lib/environment.d/50-iceland-kde-secrets.conf (iceland-device-kde 0.28-39): KWallet is the session's secrets
# provider (owner, 25 Oct 2026). Two packages declare the D-Bus name org.freedesktop.secrets for activation:
# kf6-kwallet (ksecretd, org.kde.secretservicecompat.service) and gnome-keyring (org.freedesktop.secrets.service;
# claude-desktop-extra requires gnome-keyring, so it stays installed). The session bus takes the FIRST service file that
# names it, searching ~/.local/share, then each $XDG_DATA_DIRS entry, then /usr/share. This puts a directory with one
# file - org.freedesktop.secrets -> /usr/bin/ksecretd - ahead of /usr/share for the systemd user manager, which starts
# the session bus with this environment. Nothing else lives in that directory, so no other lookup changes.
XDG_DATA_DIRS=/usr/share/iceland/session-first:${XDG_DATA_DIRS:-/usr/local/share/:/usr/share/}
