# iceland-device: /usr/lib/systemd/system/iio-sensor-proxy.service.d/iceland-sleep.conf
# 0.28-21: the proxy stops in the suspend transaction, before the sensor hub's file server. hexagonrpcd-adsp-sensorspd
# has Conflicts=suspend.target (its own unit), so it stops as the suspend begins; the proxy used to be stopped only
# later, by the system-sleep hook inside systemd-suspend, with the file server already gone - libssc could not close
# its session while the accelerometer streamed and the proxy was killed after TimeoutStopSec with a core dump (2 of 14
# suspends). The same Conflicts= puts both stops into one transaction, where systemd orders them in reverse of the
# start order: iceland.conf's After=hexagonrpcd-adsp-sensorspd.service makes the proxy stop first. Before=sleep.target
# keeps both ahead of sleep.target and systemd-suspend. iceland-sensors-mark leaves /run/iceland/sensors-stopped for
# iceland-ssc-resume.service, which starts both again after the resume (outside the suspend transaction, as before).
[Unit]
Conflicts=suspend.target
Before=sleep.target

# On the same SoC (tb323fu-linux) the proxy was seen ignoring SIGTERM, and the default 90 s stop timeout then held the
# suspend with the session frozen (black screen, power key ignored). Kill it after 3 s instead.
[Service]
TimeoutStopSec=3
ExecStopPost=-/usr/libexec/iceland/iceland-sensors-mark
