# iceland-device: /usr/lib/systemd/system/iio-sensor-proxy.service.d/iceland-sleep.conf
# The system-sleep hook iceland-sensors stops iio-sensor-proxy before every suspend. It normally exits at once, but
# on the same SoC (tb323fu-linux) it was seen ignoring SIGTERM, and the default 90 s stop timeout then held the
# suspend with the session frozen (black screen, power key ignored). Kill it after 3 s instead.
[Service]
TimeoutStopSec=3
