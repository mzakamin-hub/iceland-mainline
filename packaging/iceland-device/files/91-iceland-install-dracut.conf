# iceland-device (install): the root of the installed tablet is a loop device over the userdata partition
# (dracut module "iceland": iceland-carrier). Also brings the read-only rule for the internal storage into the
# initramfs, and the rehearsal / rollback helpers (inactive unless their boot entry asks for them).
add_dracutmodules+=" iceland "
# the rehearsal's network disk and the hardware watchdog (modules in kernel-iceland; everything on the storage
# path - UFS, sd, loop, btrfs, vfat, ext4 - is built in)
add_drivers+=" nbd qcom_wdt "
# No TPM on this tablet (no tpm device or driver in any boot log): dracut's tpm2-tss module brought only the tmpfiles /
# udev rules for the user "tss" into the initramfs, without that user (generic initramfs: dracut copies no accounts;
# r2g: "Failed to resolve user 'tss'" x6 at 0.87-0.93 s, before the switch to the root; none after it). systemd-pcrphase
# (the TPM PCR barrier; ConditionSecurity=measured-uki, skipped on every boot here) depends on tpm2-tss and goes with it
# (B run 107: "dracut[E]: Module 'systemd-pcrphase' depends on module 'tpm2-tss', which can't be installed")
omit_dracutmodules+=" tpm2-tss systemd-pcrphase "
# systemd 259 loads libseccomp with dlopen(); without it in the initramfs, systemd-udevd's SystemCallFilter is dropped
# there (r2g 0.84 s: "System call bpf cannot be resolved as libseccomp is not available")
install_items+=" /usr/lib64/libseccomp.so.2 "
# the Wi-Fi's PCIe controller (qcom-pcie 1c00000.pcie, built in) defers its probe until pci-pwrctrl-pwrseq has
# bound wifi@0 (fed by pwrseq-qcom-wcn); both are modules without firmware or module dependencies. In the
# initramfs they end the deferrals early (the kits: 14 probe attempts per boot); ath12k itself stays out (below)
add_drivers+=" pwrseq_qcom_wcn pci_pwrctrl_pwrseq "
# The SoCCP and the DSPs start in the initramfs, as in every RAM kit: qcom_q6v5_pas attaches the running SoCCP (its
# pmic-glink stack: battery manager, USB-C / UCSI, DP altmode) and boots the ADSP and the CDSP. Their firmware is the
# tablet's own (the extractor writes it to /usr/lib/firmware/updates on the root), so it is copied into the initramfs
# too - a remoteproc auto-boot that cannot find its firmware is not retried. (Round 6 kept the driver out instead; that
# moved the SoCCP stack behind the switch to the root: rehearsal R1b, 2 Oct.)
add_drivers+=" qcom_q6v5_pas qcom_glink_smem qcom_pd_mapper qrtr qrtr_smd qcom_battmgr "
install_items+=" /usr/lib/firmware/updates/qcom/kaanapali/iceland/adsp.mbn /usr/lib/firmware/updates/qcom/kaanapali/iceland/adsp_dtb.mbn /usr/lib/firmware/updates/qcom/kaanapali/iceland/cdsp.mbn /usr/lib/firmware/updates/qcom/kaanapali/iceland/cdsp_dtb.mbn "
# Drivers that need other firmware from the root stay out of the initramfs (their first request would fail there):
# Wi-Fi, Bluetooth, video. Loaded from the root by udev's coldplug after the switch, they find it. The display, touch
# and GPU firmware the early drivers need is inside (90-iceland-dracut.conf).
omit_drivers+=" qcom_q6v5_adsp qcom_q6v5_mss qcom_q6v5_wcss qcom_wcnss_pil ath12k ath11k ath10k_core ath10k_pci qcom_iris venus_core venus_dec venus_enc btqca hci_uart "
