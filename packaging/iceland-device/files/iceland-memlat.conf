# iceland-device 0.28-27 (AUDIT-2026-10-18-kernel K1); checked on the tablet: devfreq ddr / ddr-qos / llcc at boot
# /usr/lib/modules-load.d/iceland-memlat.conf: the CPUCP memlat governor (DDR / LLCC / DDR-QoS follow CPU
# memory-latency load, as on stock). Both are modules of kernel-iceland, but nothing loads them: the SCMI vendor
# protocol device (0x80) is only created once a driver asks for it, so udev never sees a device to autoload for.
# The kits loaded them from their module list (kit 135); the installed system never did. Load once at boot; the
# driver must not be reloaded. Without the modules (another kernel) systemd-modules-load logs a failure only.
qcom-generic-ext
scmi-qcom-memlat-devfreq
