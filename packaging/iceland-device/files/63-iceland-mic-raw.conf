# iceland-device (0.28-3): the raw UCM microphone source of the OnePlus Pad 4 next to the processed "Internal microphones
# (voice processing)" (pipewire.conf.d/60-iceland-mic-processing.conf): named so GNOME's Sound settings tell the two
# apart (the owner saw two inputs with different levels). Its priority stays the UCM's (CapturePriority 100 ->
# WirePlumber 1712): below the processed source (2000), so the processed one stays the default; above the speaker chain
# (1000) and the raw speaker sink (100), whose monitors WirePlumber also weighs as capture sources. Not hidden: the
# echo canceller records from it, and recordings without processing remain possible.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.platform-sound.HiFi__Mic__source" } ]
    actions = {
      update-props = {
        node.description = "Internal microphones (raw)"
      }
    }
  }
]
