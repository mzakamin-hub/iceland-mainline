# iceland-device 0.28-46: zram compression for the OnePlus Pad 4 (a zram-generator drop-in; the size stays Fedora's,
# zram-generator-defaults: min(ram, 8192) MiB; the swap settings are in /usr/lib/sysctl.d/60-iceland-vm.conf).
#
# lz4 is the primary algorithm: pages are swapped out and back in at lz4 speed (several times faster than zstd to
# decompress, which is what an app waits for). zstd is the recompression algorithm: pages that have stayed in zram
# without being touched are recompressed with zstd's better ratio by iceland-zram-recompress.timer (every hour, pages
# idle for an hour). kernel-iceland builds both backends into zram (ZRAM_BACKEND_LZ4 / _ZSTD, ZRAM_MULTI_COMP,
# ZRAM_TRACK_ENTRY_ACTIME).
# Takes effect when zram0 is set up, i.e. at the next boot. Back to Fedora's zstd only: an empty file or a link to
# /dev/null as /etc/systemd/zram-generator.conf.d/60-iceland-zram.conf.
[zram0]
compression-algorithm = lz4 zstd
