# iceland-device 0.28-46: memory knobs that live in sysfs (tmpfiles.d; a line whose file does not exist, e.g. on an
# older kernel, is skipped). A file of the same name in /etc/tmpfiles.d overrides this one.
#
# 1. GPU buffers stay out of swap: msm.enable_eviction = N. With swap present, the msm GEM shrinker may evict idle GPU
#    buffer objects to swap (here: zram); a buffer that the GPU (or the DroidLoom container sharing it) touches again
#    must then be read back under GPU / fence pressure. denialwm's Pad 4 port saw its first GPU lockups as soon as swap
#    appeared and switched it off (phonewave pad4-msm-gpu-eviction.conf, MIT; this is our own file). drm/msm is built
#    into kernel-iceland, so the parameter is not a modprobe option; it is writable at run time
#    (/sys/module/msm/parameters/enable_eviction, 0600) and only acts under memory pressure, which is long after this
#    runs. Kernel command line alternative: msm.enable_eviction=0. Cost: idle GPU buffers stay in RAM.
w /sys/module/msm/parameters/enable_eviction - - - - N
#
# 2. MGLRU working-set protection: pages used in the last 1000 ms are never reclaimed; when nothing else is left the
#    kernel's OOM killer ends a process instead of the system thrashing for minutes (the ChromeOS setting; the
#    kernel's documentation suggests 1000). 0 (the default) = off.
w /sys/kernel/mm/lru_gen/min_ttl_ms - - - - 1000
