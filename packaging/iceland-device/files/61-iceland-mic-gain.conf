# iceland-device (0.28-5): the speech level of "Internal microphones (voice processing)" on the OnePlus Pad 4.
# 0.28-4 put the UCM decimators TX_DEC0 / TX_DEC1 back to stock's register value 84 (0 dB): at 98 (= 84 + stock's 14 dB)
# the speakers' own echo clipped the raw capture in front of the echo canceller (r141: 68749 clipped samples). Stock adds
# those 14 dB LATER, in its DSP. The WebRTC gain control of 60-iceland-mic-processing.conf did not make up for them (r155:
# processed near-end speech -54.5 dBFS at 84 vs -40.4 dBFS at 98, the same 14 dB lower). This stage adds them back AFTER the
# echo canceller, noise suppression and gain control, on the processed signal only (owner, 13 Oct 2026):
#   echo-cancel source "iceland_mic_aec" (hidden: Audio/Source/Internal, 60-iceland-mic-processing.conf)
#     -> this filter-chain: fast_lookahead_limiter_1913 (ladspa-swh-plugins, the speaker chain's limiter) with its input
#        gain at +14 dB and its ceiling at -1 dBFS, release 250 ms
#     -> "Internal microphones (voice processing)" = node "iceland_mic_processed" (the name, description and priority
#        2000 of 0.28-4's processed source: still the default for accounts that never chose one; a saved choice of it
#        keeps pointing at it)
#   - The raw source "Internal microphones (raw)" stays at stock's level, and the echo canceller sees the unclipped
#     decimator output (TX_DEC 84): nothing in front of the canceller changes.
#   - Why a limiter and not a plain gain: the gain control's output may peak near full scale (a loud talker close to the
#     microphones), and +14 dB on that would clip. The limiter applies the +14 dB inside the plugin (float) and holds the
#     output peaks at -1 dBFS with 1-2 ms look-ahead (no clipping; a plain linear stage cannot), and leaves normal speech
#     (r155: about -40 dBFS rms after the gain) untouched. One plugin instance does both, so there is no unlimited
#     intermediate signal. The plugin is stereo: the one voice channel uses "Input 1" / "Output 1"; PipeWire's filter
#     graph feeds the unused second input with silence.
#   - Fail-safe: flags ifexists + nofail. Without the LADSPA plugin the module is skipped; the echo canceller's source
#     stays hidden, and the raw microphone is the default (as with no voice processing at all). The other way round is
#     NOT covered: if the echo canceller does not load (no WebRTC backend), this stage still loads and its source, with
#     no input, stays the default by priority - choose "Internal microphones (raw)" or use the off switch below.
#   - Both streams are passive (as the canceller's): the microphone is opened only while something records.
#   - Off switch: the same context property as 60-iceland-mic-processing.conf - a drop-in with
#     context.properties = { iceland.mic-processing = false } turns the canceller and this stage off together.
context.modules = [
    {   name = libpipewire-module-filter-chain
        flags = [ ifexists nofail ]
        # off together with the echo canceller (60-iceland-mic-processing.conf)
        condition = [ { iceland.mic-processing = !false } ]
        args = {
            node.description = "Internal microphones (voice processing)"
            media.name       = "Internal microphones (voice processing)"
            filter.graph = {
                nodes = [
                    { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
                        control = {
                            "Input gain (dB)" = 14
                            "Limit (dB)" = -1
                            "Release time (s)" = 0.25
                        }
                    }
                ]
                inputs  = [ "lim:Input 1" ]
                outputs = [ "lim:Output 1" ]
            }
            audio.rate = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            capture.props = {
                node.name          = "capture.iceland_mic_gain"
                node.description   = "Voice processing gain"
                # the echo canceller's hidden output (60-iceland-mic-processing.conf source.props)
                target.object      = "iceland_mic_aec"
                node.passive       = true
                node.dont-fallback = true
                # the canceller's source may appear after this module: wait for it instead of being destroyed
                node.linger        = true
                stream.dont-remix  = true
            }
            playback.props = {
                node.name        = "iceland_mic_processed"
                node.description = "Internal microphones (voice processing)"
                media.class      = Audio/Source
                priority.session = 2000
                priority.driver  = 2000
            }
        }
    }
]
