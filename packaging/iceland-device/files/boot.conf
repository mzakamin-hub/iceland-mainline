# iceland-device: boot settings applied by /usr/libexec/iceland/iceland-grub-setup (run it after a change)
# 1 = every GRUB entry loads its own kernel's device tree (a trial kernel boots with its own DT). Fedora's GRUB 2.12
#     does NOT call U-Boot's EFI DT fixup protocol (its grubaa64.efi has no EFI_DT_FIXUP_PROTOCOL GUID; wf/chgmode2),
#     so U-Boot's additions to the device tree (/chosen/u-boot,abl-boot-mode) do not reach Linux with 1.
# 0 = U-Boot's copy on the EFI partition (the confirmed kernel's DT, with U-Boot's fixups) is used for every entry
PER_KERNEL_DT=1
# seconds the GRUB menu is shown at every start (volume keys move, power selects)
TIMEOUT=3
# 1 = a power-on by the USB charger alone (the PMIC's PON log) boots into the charging mode; 0 = only ABL's mode
# (read by iceland-charging-generator at every boot; no grub-setup run needed)
CHARGING_PON=1
# 0.28-15, idle power (applied by /usr/libexec/iceland/iceland-cmdline to every boot entry and /etc/kernel/cmdline;
# run it after a change, it acts at the next boot):
# teo = cpuidle.governor=teo on the kernel command line (the TEO idle governor, as Android's GKI kernel); menu = the
#       option removed: the kernel's own choice, menu
IDLE_GOV=teo
# 1 = rcu_nocbs=all rcutree.enable_rcu_lazy=1 (RCU callbacks offloaded and batched lazily: fewer wake-ups at idle,
#     as GKI); 0 = both options removed
RCU_LAZY=1
# 0.28-19 / 0.28-20, the GPU firmware (applied by /usr/libexec/iceland/iceland-cmdline like the two above; acts at
# the next boot; a pair counts only when both of its files are installed):
# vendor533 = firmware_class.path=/usr/lib/firmware/iceland-gpu-vendor533 and msm.enable_preemption=1: the vendor GPU
#         GMU v5.3.33 / SQE 0x094 from iceland-firmware >= 11.A.38-6 with GPU preemption on, as SuperTurtleDev and
#         the TB323FU port (RAM rehearsal P2: 0 fenced-write failures / preemption timeouts / GPU faults)
# stock = firmware_class.path=/usr/lib/firmware/iceland-gpu-stock and NO preemption option (off): stock 11.A.38's
#         GMU v5.3.39 / SQE 0x103 (iceland-firmware >= 11.A.38-5)
# linux-firmware = neither option: Fedora's linux-firmware pair (GMU v5.3.23 / SQE 0x088), preemption off
GPU_FW=vendor533
# GPU preemption: auto = on exactly with vendor533; 0 = off; 1 = on, but only with vendor533 (refused with stock or
# linux-firmware: with either, preemption reset the tablet early in boot, rehearsals P1 and R3)
GPU_PREEMPT=auto
# 0.28-29 (K-4), the kernel's suspend default (applied by /usr/libexec/iceland/iceland-cmdline like the ones above):
# s2idle = mem_sleep_default=s2idle: "mem" (echo mem, rtcwake -m mem) is suspend-to-idle, the path systemd's suspend
#          uses (MemorySleepMode=s2idle) and every suspend test covered; kernel = the option removed (the kernel picks
#          PSCI SYSTEM_SUSPEND, "deep", never tested on this tablet)
MEM_SLEEP=s2idle
# 0.28-32, the display / GPU settings of 22 Oct 2026 (applied by /usr/libexec/iceland/iceland-cmdline like the ones
# above; keep = not managed, every value left as it is):
# 30 = msm.dpu_idle_refresh_ms=1000 msm.dpu_idle_refresh_hz=30 (a static screen drops to 30 Hz after 1 s);
# 0 = both removed (the kernel's default: idle refresh off)
IDLE_RR=30
# 0 = msm.dpu_bw_floor_pct=0 (no display bandwidth floor); 100 = the glitch-hunt floor of 20 Oct
BW_FLOOR=0
# 1 = msm.enable_clx=1 (GPU current limiting), only with GPU_FW=vendor533 (proven there, 22 Oct); 0 = removed
CLX=1
# 0.28-35, the TZ part of CLX (kernel q90k+: msm.a8xx_clx_tz_flag; owner's decision 24 Oct 2026 after the CLX A/B of
# q90l, rows L1-L3: with the flag TZ accepts GPU_CLX_EN_REQ and the GPU burst current drops): 1 = msm.a8xx_clx_tz_flag=1,
# only while CLX is on (CLX=1 with GPU_FW=vendor533), otherwise removed; 0 = removed; keep = not managed.
# Kernels before q90k ignore the option.
CLX_TZ=1
# 0.28-38, GIC pseudo-NMI (irqchip.gicv3_pseudo_nmi=1): UNSUPPORTED on the OnePlus Pad 4 - with it the kernel hangs
# before any output (the Gunyah hypervisor does not let the host use GIC priority masking; q90o-run stage C,
# 24 Oct 2026). 0 = the option is removed; keep = not managed; 1 is refused (0.28-40) and counts as 0.
PSEUDO_NMI=0
# 0.28-40, the display options of the glitch hunt (msm.dpu_dsc_once=1, msm.dpu_vfp_inplace=1, ..., the panel's
# stock_power_timing=1 / bl_after_video=1; until now hand edits from /etc/iceland/glitchfix.conf): 1 = managed - an
# older kernel's entry gets all of them, a kernel q90p+ entry only the ones that differ from its built-in defaults
# (none); keep = not managed. Kernel q90p+ also has the defaults of IDLE_GOV=teo, RCU_LAZY=1, MEM_SLEEP=s2idle,
# IDLE_RR=30, CLX=1 / CLX_TZ=1 and GPU_PREEMPT=auto built in: its entries carry an option only when a switch above
# is set away from its default (the kernel then gets the explicit value).
GLITCH=1
# 0.28-34, the boot splash (applied by /usr/libexec/iceland/iceland-cmdline like the ones above; acts at the next
# boot): keep = not managed (Fedora's rhgb stays as it is); 0 = rhgb removed: no Plymouth splash, the quiet text
# console until GDM takes the display (systemd-analyze then no longer counts plymouth-quit-wait's ~4.3 s wait for
# GDM; the time to the login screen hardly changes); 1 = rhgb added
SPLASH=keep
