# iceland-device: boot settings applied by /usr/libexec/iceland/iceland-grub-setup (run it after a change)
# 1 = every GRUB entry loads its own kernel's device tree (needs U-Boot's EFI DT fixup protocol, proven in the
#     install rehearsal); 0 = U-Boot's copy on the EFI partition is used for every entry
PER_KERNEL_DT=1
# seconds the GRUB menu is shown at every start (volume keys move, power selects)
TIMEOUT=3
