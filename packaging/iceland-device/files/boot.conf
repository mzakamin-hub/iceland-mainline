# iceland-device: boot settings applied by /usr/libexec/iceland/iceland-grub-setup (run it after a change)
# 1 = every GRUB entry loads its own kernel's device tree (a trial kernel boots with its own DT). Fedora's GRUB 2.12
#     does NOT call U-Boot's EFI DT fixup protocol (its grubaa64.efi has no EFI_DT_FIXUP_PROTOCOL GUID; wf/chgmode2),
#     so U-Boot's additions to the device tree (/chosen/u-boot,abl-boot-mode) do not reach Linux with 1.
# 0 = U-Boot's copy on the EFI partition (the confirmed kernel's DT, with U-Boot's fixups) is used for every entry
PER_KERNEL_DT=1
# seconds the GRUB menu is shown at every start (volume keys move, power selects)
TIMEOUT=3
# 1 = a power-on by the USB charger alone (the PMIC's PON log) boots into the charging mode; 0 = only ABL's mode
# (read by iceland-charging-generator at every boot; no grub-setup run needed)
CHARGING_PON=1
# 0.28-15, idle power (applied by /usr/libexec/iceland/iceland-cmdline to every boot entry and /etc/kernel/cmdline;
# run it after a change, it acts at the next boot):
# teo = cpuidle.governor=teo on the kernel command line (the TEO idle governor, as Android's GKI kernel); menu = the
#       option removed: the kernel's own choice, menu
IDLE_GOV=teo
# 1 = rcu_nocbs=all rcutree.enable_rcu_lazy=1 (RCU callbacks offloaded and batched lazily: fewer wake-ups at idle,
#     as GKI); 0 = both options removed
RCU_LAZY=1
# 0.28-19 / 0.28-20, the GPU firmware (applied by /usr/libexec/iceland/iceland-cmdline like the two above; acts at
# the next boot; a pair counts only when both of its files are installed):
# vendor533 = firmware_class.path=/usr/lib/firmware/iceland-gpu-vendor533 and msm.enable_preemption=1: the vendor GPU
#         GMU v5.3.33 / SQE 0x094 from iceland-firmware >= 11.A.38-6 with GPU preemption on, as SuperTurtleDev and
#         the TB323FU port (RAM rehearsal P2: 0 fenced-write failures / preemption timeouts / GPU faults)
# stock = firmware_class.path=/usr/lib/firmware/iceland-gpu-stock and NO preemption option (off): stock 11.A.38's
#         GMU v5.3.39 / SQE 0x103 (iceland-firmware >= 11.A.38-5)
# linux-firmware = neither option: Fedora's linux-firmware pair (GMU v5.3.23 / SQE 0x088), preemption off
GPU_FW=vendor533
# GPU preemption: auto = on exactly with vendor533; 0 = off; 1 = on, but only with vendor533 (refused with stock or
# linux-firmware: with either, preemption reset the tablet early in boot, rehearsals P1 and R3)
GPU_PREEMPT=auto
