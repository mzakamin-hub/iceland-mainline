# iceland-device: panel refresh rate by power source (iceland-refresh). ENABLED=0 turns it off.
BATTERY_HZ=60
AC_HZ=120
ENABLED=1
# RELIGHT=1: after every refresh-rate change of the built-in panel (also the ones made in GNOME Settings) switch the
# display off for RELIGHT_OFF_MS and on again. Only for kernels without queue patch 0058, where a live rate change
# leaves the panel black.
RELIGHT=0
RELIGHT_OFF_MS=1000
# 0.28-29 (GAPS-2026-10-18 P-1), OFF by default: DISCHARGING_IS_BATTERY=1 counts a battery that DISCHARGES while a
# USB source is plugged in (a weak charger or a PC port: UPower's State "discharging", OnBattery false) as battery
# (BATTERY_HZ). Such a change waits DISCHARGING_DELAY_S seconds and is checked again (the state follows the load).
# Enable it only after the kernel's in-place 120 <-> 60 Hz switch (q89v D-1) is installed: today every rate change
# is a full modeset (an underrun pair, a short flicker) and this rule can switch more often. After a change:
# systemctl --user restart iceland-refresh
DISCHARGING_IS_BATTERY=0
DISCHARGING_DELAY_S=120
