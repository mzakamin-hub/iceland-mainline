# iceland-device: panel refresh rate by power source (iceland-refresh). ENABLED=0 turns it off.
BATTERY_HZ=60
AC_HZ=120
ENABLED=1
# After every refresh-rate change of the built-in panel (also the ones made in GNOME Settings) switch the display
# off for RELIGHT_OFF_MS and on again: a live rate change leaves the panel black with the current kernel.
RELIGHT=1
RELIGHT_OFF_MS=1000
