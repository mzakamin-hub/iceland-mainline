# iceland-device: btrfs snapshots of the root before package transactions (iceland-snapshot)
# number of snapshots kept (the oldest are deleted after a new one is taken)
KEEP=3
# 0.28-36: the root subvolume to snapshot, by its name in the btrfs top level. Empty (default) = the one mounted at /
# ("root" on the image layout, "fedora-root" on iceland-coexist's shared-boot layout, where no "Roll back" boot entries
# are written: roll back with "iceland-snapshot rollback NAME")
#SUBVOL=
