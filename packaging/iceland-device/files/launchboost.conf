# iceland-launchboost settings (read at every launch, no restart needed).
# Stock (perfboostsconfig.xml hint 0x1081 Type 5): 600 ms after an app launch, sched_boost 1 and CPU minimum
# 3302400 / 4070400 kHz. Here: util_min on the new app unit's threads; 904 = the capacity of 4070400 kHz in the
# energy model (above the small cores' 799, so the threads run on the big cores). The thermal caps still apply.
# ENABLE=0 switches it off.
ENABLE=1
UTIL_MIN=904
BOOST_MS=600
# at most one boost start per MIN_GAP_MS (a login starts many units at once)
MIN_GAP_MS=1000
# wait after the cgroup appears before reading its processes (systemd moves the PID in after the mkdir)
SETTLE_MS=30
