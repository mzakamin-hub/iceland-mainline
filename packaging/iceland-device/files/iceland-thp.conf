# iceland-device 0.28-9: transparent huge pages only for the programs that ask for them (madvise) instead of the
# kernel's "always" (CONFIG_TRANSPARENT_HUGEPAGE_ALWAYS). Stock OxygenOS 11.A.38 switches them off completely
# (odm/bin/init.oplus.mm-vnd.sh configure_thp: never; QCOM's "always" in init.kernel.post_boot-memory.sh is
# commented out); madvise stays below that while keeping huge pages for the programs that request them (JITs,
# some databases). "always" lets every large anonymous mapping take 2 MiB pages: more memory per process on an
# 11 GiB tablet with zram, and the fragmentation that kcompactd then works against. Defrag stays Fedora's
# "madvise". A file of the same name in /etc/tmpfiles.d overrides this one.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
