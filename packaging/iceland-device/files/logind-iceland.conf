# iceland-device: /usr/lib/systemd/logind.conf.d/60-iceland.conf
# What logind does when the cover closes (the hall switch behind kernel-iceland's gpio-keys "Lid" input).
#
# On battery: the tablet suspends (s2idle); opening the cover wakes it (the lid switch is a wake source and
#   wakes on the open only).
# With a charger in: the session is locked, which turns the screen off, but the tablet does NOT suspend - a
#   suspended system cannot watch the charging (iceland-battery-guard is frozen, the kernel's charger poll stops).
#   Stock keeps its kernel awake from plug-in to unplug (OnePlus sm8850-modules, oplus_chg_wired.c:1872 / :1968,
#   wake lock "wired wakelock") and turns the screen off when the cover closes. When the charger is pulled with
#   the cover still closed, the guard gives its sleep lock back, logind looks at the lid again and suspends.
# With an external display on the USB-C port: the cover does nothing (logind's default, stated here).
#
# The power key is left to GNOME (a press suspends; the press that wakes the tablet is ignored for 3 s after the
# resume). Without a desktop session logind's own default stays.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=lock
HandleLidSwitchDocked=ignore
