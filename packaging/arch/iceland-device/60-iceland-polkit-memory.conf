# iceland-device: polkitd's memory ceiling. A storm of authorisation checks (the sensor claim storm of TEST-PLAN SN3:
# 8 clients x 60 rounds) must not let polkitd grow without bound; at 128M the kernel reclaims / OOM-kills polkitd
# alone and systemd restarts it, instead of the whole session paying for it.
[Service]
MemoryMax=128M
