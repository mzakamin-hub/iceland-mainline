# /usr/share/wireplumber/wireplumber.conf.d/53-iceland-no-pro-audio.conf (iceland-device 0.28-52)
# The card has a UCM profile (HiFi: Speaker, Headphones, Mic, HDMI0); the desktop never uses ACP's "Pro Audio"
# profile. Probing that profile opens every PCM of the topology, including MultiMedia4 Capture, which no UCM
# route uses, so the kernel logged "ASoC: no backend DAIs enabled for MultiMedia4 Capture" at every start and the
# DSP graph open failed. Off switch: an empty file of the same name in /etc/wireplumber/wireplumber.conf.d/.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
