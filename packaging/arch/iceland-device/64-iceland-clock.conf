# iceland-device (0.28-50): minimum graph quantum 2048 frames (42.7 ms at 48 kHz) for the OnePlus Pad 4.
# Part 3 of 3 of the fix for speaker crackle while a microphone is open (parts 1-2: wireplumber.conf.d/
# 64-iceland-clocks.conf). The card's capture PCM reports its delay in whole 40 ms periods; as a follower of the
# speaker sink its delay error jumps by up to ~1700 frames, and PipeWire resyncs a follower whose error exceeds the
# quantum. With the quantum above that step the follower is rate-matched quietly. Our echo canceller
# (60-iceland-mic-processing.conf) keeps the speaker monitor and the microphone open together whenever something
# records from "Internal microphones (voice processing)", so this case is common here.
# Measured by jstockdale on the same card (ubuntu-oneplus-pad-4, 2 Nov 2026): 16 resyncs per 36 s at the default
# quantum, 0 at 2048; 51 resyncs per 3 min before all three parts, 0 after.
# Cost: every stream's minimum latency becomes ~43 ms (fine for playback and calls on a tablet). One session can
# lower it at run time:  pw-metadata -n settings 0 clock.min-quantum <frames>
# Turning it off for good: a later drop-in, e.g. /etc/pipewire/pipewire.conf.d/90-iceland-clock-off.conf (every
# account) or ~/.config/pipewire/pipewire.conf.d/90-iceland-clock-off.conf (one account), with the one line
#     context.properties = { default.clock.min-quantum = 32 }
# (32 = PipeWire's default), then systemctl --user restart pipewire.
#
# Adapted from jstockdale/ubuntu-oneplus-pad-4 packaging/ubuntu-iceland-device/usr/share/pipewire/pipewire.conf.d/
# 64-iceland-clock.conf (commit 56624238), BSD-3-Clause:
#   Copyright (c) 2026, the Ubuntu OnePlus Pad 4 (iceland) port contributors. Redistribution and use in source and
#   binary forms, with or without modification, are permitted provided that the conditions of the BSD 3-Clause
#   License are met (retain this notice; no endorsement by the names of the contributors). THIS SOFTWARE IS PROVIDED
#   "AS IS" WITHOUT ANY WARRANTY. Full text: /usr/share/licenses/iceland-device/LICENSE.BSD-3-Clause.ubuntu-iceland
context.properties = {
    default.clock.min-quantum = 2048
}
