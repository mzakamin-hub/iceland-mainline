# iceland-device (0.28.53-20: moved from iceland-device-hypr, not tied to Hyprland / Omarchy): Wi-Fi power saving ON (ath12k WCN7860), as iceland-device's
# /usr/lib/NetworkManager/conf.d/60-iceland-wifi-powersave.conf says. Omarchy's
# /etc/NetworkManager/conf.d/omarchy-wifi-powersave.conf sets it off (2), and NetworkManager reads every /usr/lib
# snippet before any /etc one (checked with NetworkManager --print-config, 24 Nov: /usr/lib 60-* and /usr/lib zz-* both
# lose to it), so the project value has to come from /etc and sort after "omarchy-*" there.
# Without Omarchy this file only repeats the /usr/lib value (power saving on); it stays so that a leftover
# omarchy-wifi-powersave.conf (Omarchy writes it in /etc, it may outlive the package) cannot switch it off.
[connection]
wifi.powersave = 3
