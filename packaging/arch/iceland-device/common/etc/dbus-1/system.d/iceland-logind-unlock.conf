<?xml version="1.0"?> <!--*-nxml-*-->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
        "https://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  iceland-device (0.28.53-20: moved from iceland-device-hypr, not tied to Hyprland / Omarchy) (owner 24 Nov ~04:20: "loginctl unlock-session unlocks the lock screen, like KDE"): logind's
  Unlock ends Omarchy's shell lock (Service.qml of the omarchy-pad.lock clone, injected by iceland-lock-unlock-inject).
  logind itself lets a session's OWNER unlock that session without any authentication (it checks polkit only for
  other users), so without this file any program running as the desktop user could unlock the screen. Here only
  root may ask logind to unlock: the three unlock methods are denied in the default context and allowed for root
  only. This file is in /etc/dbus-1/system.d, which the bus reads after /usr/share/dbus-1/system.d (logind's own
  org.freedesktop.login1.conf allows these calls in the default context; the last matching rule wins), and a
  user="root" policy applies after the default context. Lock (lock-session) stays allowed for everyone.
  0.28.53-20: generic, kept for every desktop: Plasma's screen locker also ends its lock on logind's Unlock
  signal, so without this file any program of the desktop user could unlock a Plasma lock screen too
  (`loginctl unlock-session` as root, e.g. the test tooling's remote unlock, keeps working).
-->
<busconfig>
        <policy context="default">
                <deny send_destination="org.freedesktop.login1"
                      send_interface="org.freedesktop.login1.Session"
                      send_member="Unlock"/>
                <deny send_destination="org.freedesktop.login1"
                      send_interface="org.freedesktop.login1.Manager"
                      send_member="UnlockSession"/>
                <deny send_destination="org.freedesktop.login1"
                      send_interface="org.freedesktop.login1.Manager"
                      send_member="UnlockSessions"/>
        </policy>
        <policy user="root">
                <allow send_destination="org.freedesktop.login1"
                       send_interface="org.freedesktop.login1.Session"
                       send_member="Unlock"/>
                <allow send_destination="org.freedesktop.login1"
                       send_interface="org.freedesktop.login1.Manager"
                       send_member="UnlockSession"/>
                <allow send_destination="org.freedesktop.login1"
                       send_interface="org.freedesktop.login1.Manager"
                       send_member="UnlockSessions"/>
        </policy>
</busconfig>
