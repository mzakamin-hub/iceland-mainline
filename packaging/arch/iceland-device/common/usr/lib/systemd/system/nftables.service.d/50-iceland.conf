# iceland-device (0.28.53-20: moved from iceland-device-hypr, not tied to Hyprland / Omarchy): stopping nftables removes only the iceland tables (see /usr/share/iceland/nftables-stop.nft)
# pkgrel 8 (24 Nov, SECURITY): Arch's nftables.service is Type=oneshot WITHOUT RemainAfterExit, so the unit went
# inactive right after loading the rules and our ExecStop ran at once, removing iceland_greeter (the greeter's
# no-network table), droidloom_egress and iceland_vms at boot (journal 24 Nov: loaded 3.27 s, removed 3.43 s).
# RemainAfterExit keeps the unit active until a real stop; ExecReload reloads the ruleset as Fedora's unit does.
[Service]
RemainAfterExit=yes
ExecReload=
ExecReload=/usr/bin/nft -f /etc/nftables.conf
ExecStop=
ExecStop=/usr/bin/nft -f /usr/share/iceland/nftables-stop.nft
