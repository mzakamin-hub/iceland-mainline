# iceland-device (0.28.53-20: moved from iceland-device-hypr, not tied to Hyprland / Omarchy): DroidLoom's own Arch Linux ARM repository (OPEN-DECISIONS D6, owner: (a) upstream unsigned repo,
# accepted 23 Nov 2026; "its repo stays usable for updates"). From upstream's docs/INSTALL.md and install.sh
# (github.com/denialwm/droidloom): the database on GitHub Pages, the package files on GitHub Releases, UNSIGNED over
# HTTPS (SigLevel = Never for this repository only).
# The arch1 image writes this section at the END of /etc/pacman.conf (after [iceland-local], [omarchy], core, extra,
# alarm): a name that any earlier repository has always comes from there, so [droidloom] can never replace another
# package; it supplies only names nobody else has (release 49: droidloom-runtime, droidloom-image, droidloom-base).
# A NEW name upstream adds would be installable from here (pacman has no per-repo name list):
# iceland-droidloom-pacman plan shows what [droidloom] would supply before an update.
[droidloom]
SigLevel = Never
Server = https://denialwm.github.io/droidloom/$arch
CacheServer = https://github.com/denialwm/droidloom/releases/download/packages
