#!/usr/bin/nft -f
# OnePlus Pad 4 / Omarchy: /etc/nftables.conf (installed by the rootfs build). Only the iceland drop-ins:
# greeter no-network (iceland_greeter), DroidLoom egress (droidloom_egress), the VM app NAT (iceland_vms).
# Inbound stays open as on Fedora's KDE build (sshd key-only; OPEN-DECISIONS D19).
# iceland-device (0.28.53-20: moved from iceland-device-hypr, not tied to Hyprland / Omarchy) 0.28.53-2: no "flush ruleset" any more. Tables that other programs create at run time must
# survive a reload of this file: NetworkManager's shared-mode NAT for the VM tap (nm-shared-*), Tailscale's and
# DroidLoom's own. Only our own tables are removed and loaded again ("destroy" is a no-op when a table is absent).
destroy table inet iceland_greeter
destroy table inet droidloom_egress
destroy table inet iceland_vms
include "/etc/nftables.d/*.nft"
