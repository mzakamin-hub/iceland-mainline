# iceland-device (0.28-50): no WirePlumber device for the OnePlus Pad 4's compressed-audio node.
# Our AudioReach topology has a compress-offload front end (MultiMedia5, /dev/snd/comprC0D*). WirePlumber's ALSA
# monitor emits it as a SECOND card object (alsa_card.comprC0...) for the same hw:0. Both objects then compete for
# the D-Bus name org.freedesktop.ReserveDevice1.Audio0 ("wp_reserve_device_own_name: assertion 'self->owner_id == 0'
# failed" at boot) and whichever loses the reservation is switched to the profile "off": when that is the real card,
# every sink and source disappears mid-session ("No Input Devices", silent apps). Seen twice on 2 Nov 2026 on the same
# card by jstockdale (WirePlumber 0.5.13 / PipeWire 1.6.2). The real card (alsa_card.platform-sound) keeps HiFi;
# nothing of ours uses compress offload.
# Check: wpctl status lists one OnePlus Pad 4 card; pw-dump | grep -c comprC = 0.
#
# Adapted from jstockdale/ubuntu-oneplus-pad-4 packaging/ubuntu-iceland-device/usr/share/wireplumber/
# wireplumber.conf.d/52-iceland-compress.conf (commit 56624238), BSD-3-Clause:
#   Copyright (c) 2026, the Ubuntu OnePlus Pad 4 (iceland) port contributors. Redistribution and use in source and
#   binary forms, with or without modification, are permitted provided that the conditions of the BSD 3-Clause
#   License are met (retain this notice; no endorsement by the names of the contributors). THIS SOFTWARE IS PROVIDED
#   "AS IS" WITHOUT ANY WARRANTY. Full text: /usr/share/licenses/iceland-device/LICENSE.BSD-3-Clause.ubuntu-iceland
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.compr.*" } ]
    actions = { update-props = { device.disabled = true } }
  }
]
