# iceland-device-hypr: the greetd greeter session (user "greeter"): Hyprland + fcitx5 + floatkey (auto-shown on the
# focused password / user field through fcitx5's input-method-v2) + ReGreet. Clipboard history, dictation and
# translation of floatkey are off here (floatkey --greeter profile; ROOTFS-PLAN). buffyboard on the VT is the fallback.
monitor = DSI-1, 3392x2400@60, 0x0, 2
input { touchdevice { output = DSI-1 } }
misc { disable_hyprland_logo = true }
exec-once = fcitx5 -d --replace
exec-once = floatkey --hidden --no-clipboard-history --no-dictation
exec-once = regreet; hyprctl dispatch exit
