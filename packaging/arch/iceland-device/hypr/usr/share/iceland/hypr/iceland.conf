# OnePlus Pad 4: 13.2" 3392x2400, up to 144 Hz in hardware; scale 2 = 1696x1200. hyprlang cannot read the user's
# refresh choice, so this form starts at 120 Hz and iceland-hypr-refresh moves the panel to the rate that applies
# (~/.config/iceland/refresh-choice: auto = 60 Hz on battery / 120 Hz on AC, or 60 / 90 / 120 / 144; thermal cap wins)
# (hyprlang form of iceland.lua for a hyprland.conf user; Hyprland 0.56: vfr is debug:vfr, misc:vfr is gone)
monitor = DSI-1, 3392x2400@120, 0x0, 2
input {
    kb_layout = us
    touchdevice {                      # touch follows the panel's transform
        output = DSI-1
    }
    tablet {                           # pen (nt36536 stylus) likewise
        output = DSI-1
    }
}
misc { key_press_enables_dpms = false }   # the power key alone decides
debug { vfr = true }                   # no frames when nothing changes (with the kernel's 30 Hz idle refresh)
decoration { blur { enabled = false } shadow { enabled = false } }   # GPU time / power on a battery device
animations { enabled = true }
# touch workspace swipe from the left / right edge (pkgrel 15) is OFF since pkgrel 16: Hyprland 0.56.2 Touch.cpp drops
# every new touch-down while a touch swipe is in progress and ends it only on a touch-up with the same id; a cancelled /
# lost touch-up (e.g. pen touch arbitration) left ALL touch dead, the lock keyboard included, until a reboot (24 Nov).
# Android-style gestures are being designed separately.
gestures {
    workspace_swipe_touch = false
    workspace_swipe_touch_invert = false
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = 0.2
    workspace_swipe_min_speed_to_force = 15
    workspace_swipe_direction_lock = true
}
cursor {                               # no pointer left where the finger / pen was
    hide_on_touch = true
    hide_on_tablet = true
}
ecosystem {                            # never the update news / donation screens
    no_update_news = true
    no_donation_nag = true
}
