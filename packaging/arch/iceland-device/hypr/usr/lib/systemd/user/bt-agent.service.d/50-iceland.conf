# iceland-device-hypr (from upstream omarchy-pad's bt-agent drop-in, samyn92/omarchy-pad 593a489, MIT): Omarchy's
# Bluetooth pairing agent waits for BlueZ instead of skipping itself. Omarchy's bt-agent.service skips itself unless
# bluetooth.service is ALREADY active when the session starts; on the OnePlus Pad 4 bluetoothd waits for
# iceland-bdaddr (the adapter's address), so the agent was skipped for the whole login and pairing requests (the
# owner's BT keyboard cover) went unanswered. Here it only asks that Bluetooth is enabled, then waits up to 60 s for
# bluetoothd on the system bus before it registers.
[Service]
ExecCondition=
ExecCondition=/usr/bin/systemctl is-enabled --quiet bluetooth.service
ExecStartPre=/usr/bin/gdbus wait --system --timeout 60 org.bluez
