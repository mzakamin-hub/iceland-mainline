# iceland-device-hypr: the login screen on the OnePlus Pad 4. Loads after Omarchy's 10-*.conf.
# Theme: omarchy-iceland (sddm-theme-omarchy-iceland): Omarchy's theme with the password keys drawn in the theme.
# Compositor: our greeter Hyprland config (60 Hz, scale 2, touch mapped; wvkbd only with GREETER_OSK=wvkbd in
# /etc/iceland/greeter-osk.conf). InputMethod is not set: SDDM ignores qtvirtualkeyboard on Wayland.
[Theme]
Current=omarchy-iceland

[Wayland]
CompositorCommand=start-hyprland -- --config /usr/share/iceland/sddm/hyprland-greeter.lua
# SDDM's wayland-session with exit status 1 mapped to 2 (status 1 = "failed login" to SDDM: black screen, no greeter)
SessionCommand=/usr/libexec/iceland/iceland-wayland-session
