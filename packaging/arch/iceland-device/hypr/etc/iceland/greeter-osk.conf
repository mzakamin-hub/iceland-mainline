# Login screen (SDDM greeter) on-screen keyboard, read by the greeter's Hyprland config
# (/usr/share/iceland/sddm/hyprland-greeter.lua) and /usr/libexec/iceland/iceland-greeter-osk.
#   theme  the keys drawn inside the omarchy-iceland SDDM theme (default; also used when this file is missing)
#   wvkbd  wvkbd-mobintl started inside the greeter compositor (fallback; install wvkbd first)
# Takes effect at the next greeter start (systemctl restart sddm, or a reboot).
GREETER_OSK=theme
