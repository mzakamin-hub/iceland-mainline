# /usr/lib/environment.d/51-iceland-kde-powerdevil.conf (iceland-device-kde 0.28-47): PowerDevil does not probe
# DDC/CI. The Pad 4's panel is DSI (no DDC/CI); PowerDevil's ddcutil probe opened every /dev/i2c-* at each start and
# logged EACCES (8 lines in the 6 Nov 2026 probe). PowerDevil runs as a systemd user unit (plasma-powerdevil.service)
# and gets this environment from the systemd user manager. An external monitor's brightness over DDC/CI is then not
# offered; remove the variable (systemctl --user set-environment POWERDEVIL_NO_DDCUTIL=0) to probe again.
POWERDEVIL_NO_DDCUTIL=1
