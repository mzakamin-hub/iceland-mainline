# /etc/plasmalogin.conf.d/30-iceland.conf (iceland-device-kde 0.28.53-20, Arch): Plasma Login Manager on the OnePlus
# Pad 4 (owner 26 Nov 2026: plasma-login-manager instead of SDDM). plasma-login-manager 6.8 reads
# /usr/lib/plasmalogin/defaults.conf, /usr/lib/plasmalogin/plasmalogin.conf.d, /etc/plasmalogin.conf.d and
# /etc/plasmalogin.conf (System Settings > Login Screen writes the last one). This drop-in only presets the session.
# - Wayland greeter: always (plasma-login-kwin_wayland.service, user "plasmalogin", KWin with
#   "--inputmethod plasma-keyboard": the on-screen keyboard is there without any setting here).
# - Scale / rotation of the greeter: the greeter's KWin uses /var/lib/plasmalogin/.config/kwinoutputconfig.json;
#   System Settings > Login Screen > "Apply Plasma Settings" copies the user's (200 %, rotation) there.
# - The service is NOT enabled by this package (plan phase P2 switches sddm -> plasmalogin; plm-switch.sh).
[Greeter]
PreselectedSession=plasma.desktop
