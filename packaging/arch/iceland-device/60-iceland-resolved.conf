# /usr/lib/systemd/resolved.conf.d/60-iceland-resolved.conf (iceland-device 0.28-47): systemd-resolved answers and
# sends neither LLMNR nor multicast DNS. avahi-daemon stays the tablet's mDNS responder / browser (.local names, printers);
# only resolved's own copy goes off, so the two no longer compete for port 5353. A file of the same name in
# /etc/systemd/resolved.conf.d overrides this one.
[Resolve]
LLMNR=no
MulticastDNS=no
