# iceland-device (Arch): no LUKS in the initramfs. The arch1 root is a plain btrfs subvolume (no encrypted root, no
# crypttab), and dracut's crypt module's generator failed in every arch1 initrd ("dracut-crypt-generator failed with
# exit status 2", 24 Nov). systemd-cryptsetup is the module that would pull crypt back in, so both stay out.
omit_dracutmodules+=" crypt systemd-cryptsetup "
