# iceland-device: GNOME power mode "Power Saver" on the OnePlus Pad 4.
# CPU: schedutil from the table floors (384000 / 768000 kHz), capped at stock's lightest CPU cap, thermal level 0
# (iceland-thermal CPU_LEVEL[0] = 3033600 / 3398400 kHz): 3033600 kHz on the small cluster (0.28-53, owner 22 Nov
# 2026; was 2611200, the walt zone_max_util_pct edge, which made Power Saver slower than stock's lightest cap) and
# 3513600 kHz written on the big one (the first smart_freq IPC level of cluster 1; the big cluster has no such step,
# so the kernel uses the one below, 3398400 kHz = stock level 0, and scaling_max_freq reads back that value);
# no boost. GPU: DCVS capped at 902 MHz, the last level before the TURBO levels (our choice, not a stock setting:
# stock has no power-saver GPU cap in its boot scripts).
[main]
summary=OnePlus Pad 4: power saver - stock level-0 caps on the CPUs, GPU below TURBO

[cpu]
priority=10
governor=schedutil
boost=0

[sysfs]
priority=20
/sys/devices/system/cpu/cpufreq/policy0/scaling_min_freq=384000
/sys/devices/system/cpu/cpufreq/policy6/scaling_min_freq=768000
/sys/devices/system/cpu/cpufreq/policy0/scaling_max_freq=3033600
/sys/devices/system/cpu/cpufreq/policy6/scaling_max_freq=3513600
/sys/class/devfreq/3d00000.gpu/min_freq=160000000
/sys/class/devfreq/3d00000.gpu/max_freq=902000000
# 0.28-34: schedutil rate limit 2 ms, UFS auto-hibern8 10 ms (POWER-ROUND-2)
/sys/devices/system/cpu/cpufreq/policy0/schedutil/rate_limit_us=2000
/sys/devices/system/cpu/cpufreq/policy6/schedutil/rate_limit_us=2000
/sys/devices/platform/soc@0/1d84000.ufs/auto_hibern8=10000

[sysctl]
kernel.sched_util_clamp_min_rt_default=0
vm.dirty_writeback_centisecs=1500

[audio]
timeout=10
