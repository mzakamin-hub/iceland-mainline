# iceland-ppd 1.0-5: power-profiles-daemon offers all three profiles (Power Saver / Balanced / Performance) on the
# OnePlus Pad 4.
# Why: power-profiles-daemon 0.30 lists a profile only when a driver implements it. On this SoC there is no
# platform_profile (ACPI) and its CPU drivers are intel_pstate / amd_pstate only; the scmi / qcom-cpufreq-hw cpufreq
# here matches none of them, so only the generic "placeholder" platform driver loads (power-saver + balanced).
# Omarchy's build (omarchy-power-profiles-daemon 0.30-3) had added its own "cpufreq" CPU driver for scmi /
# qcom-cpufreq-hw / apple-cpufreq (caps scaling_max_freq, toggles boost); Arch's package has none.
# How: power-profiles-daemon's own "fake" platform driver (upstream, compiled into Arch's binary; README "Testing")
# declares all three profiles and writes nothing. It loads before the placeholder and takes its place. All values
# stay with iceland-ppd-hook, which follows ActiveProfile and writes the iceland-* profiles (performance ->
# iceland-performance: stock's 4512000 / 4608000 kHz turbo steps and stock's performance-mode floors, nothing above
# stock); iceland-thermal keeps capping every profile as before. Interactive keys only when stdout is a tty, which it
# never is under systemd. Removing iceland-ppd removes this file: power-profiles-daemon is plain Arch again.
[Service]
Environment=POWER_PROFILE_DAEMON_FAKE_DRIVER=1
