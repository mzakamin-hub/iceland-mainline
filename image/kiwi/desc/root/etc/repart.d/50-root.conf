# Fedora's first-boot growth rule (as in the official Workstation-Disk image B149 started from): systemd-repart grows the
# root partition (type root-arm64, the last one) to the end of the disk at the first boot; x-systemd.growfs in /etc/fstab
# grows the btrfs; iceland-grow (iceland-device) repairs what is still missing. Masking systemd-repart keeps the size.
[Partition]
Type=root
