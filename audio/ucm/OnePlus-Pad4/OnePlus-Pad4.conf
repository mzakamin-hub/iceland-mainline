Syntax 4

# OnePlus Pad 4 (Kaanapali, card "OnePlusPad4", long name "oneplus-OnePlusPad4"): six TFA9865 amplifiers on
# the primary TDM port, two analog microphones on the WCD9395. Installed as
# ucm2/Qualcomm/kaanapali/OnePlus-Pad4/OnePlus-Pad4.conf, linked from ucm2/conf.d/kaanapali/oneplus-OnePlusPad4.conf.

SectionUseCase."HiFi" {
	File "/Qualcomm/kaanapali/OnePlus-Pad4/HiFi.conf"
	Comment "HiFi quality Music."
}

# Run by alsactl from ALSA's udev rule (90-alsa-restore.rules) when the card appears, i.e. before WirePlumber
# receives the udev event. WirePlumber's ACP must be able to open the DPCM front ends, which needs their back-end
# routes on (pc-026 S10: otherwise the HiFi profile is dropped and only a Dummy Output remains). The routes only
# connect the graph; nothing is powered until a stream runs. The speaker gain cap is set here too, so raw ALSA
# users also get it (answer pc-026-s8-s9; 2056 = -12 dB is a PLACEHOLDER until the stock limits are known).
FixedBootSequence [
	cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
	cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 2056"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
