# OnePlus Pad 4 (Kaanapali, card "OnePlusPad4", long name "oneplus-OnePlusPad4"): six TFA9865 amplifiers on
# the primary TDM port, two analog microphones on the WCD9395. Installed as
# ucm2/Qualcomm/kaanapali/OnePlus-Pad4/OnePlus-Pad4.conf, linked from ucm2/conf.d/kaanapali/oneplus-OnePlusPad4.conf.

SectionUseCase."HiFi" {
	File "/Qualcomm/kaanapali/OnePlus-Pad4/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd939x/init.conf"
