# OnePlus Pad 4: speakers = MultiMedia1 -> PRIMARY_TDM_RX_0 (the DSP feeds the six TFA9865 over TDM; no mixer
# controls on that path, the amplifiers are configured by their driver); microphones = the two analog mics
# (AMIC1 -> ADC1, AMIC5 -> ADC3 on the WCD9395) -> TX macro SWR_MIC0/2 -> DEC0/1 -> TX_CODEC_DMA_TX_3 -> MultiMedia3;
# headphones = MultiMedia2 -> RX_CODEC_DMA_RX_0 -> RX macro -> WCD9395 HPH (class-H, PDM), headset microphone =
# AMIC2 -> ADC2 -> SWR_MIC1 -> DEC0 -> MultiMedia3. The headset lines reach the USB-C connector through the WCD9395
# USB-SS switch in Type-C audio accessory mode (no 3.5 mm jack); the codec reports the plug as "Headphone Jack" /
# "Mic Jack" (one "Headset Jack" input device).
#
# Separate PCMs per output (speakers hw:,0, headphones hw:,1): PipeWire's ACP treats devices on one PCM as
# conflicting and puts them into different profiles, which it does not switch on a jack event. The headset mic has to
# share MultiMedia3 with the internal mics (one TX back end, one decimator set), so Mic and Headset are conflicting
# devices: ACP makes two profiles, "HiFi (Headphones, Mic, Speaker)" (the default) and "HiFi (Headphones, Headset,
# Speaker)". Values: stock mixer_paths.xml (OOS 11.A.38) "headphones" / "headset-mic", mapped to mainline controls.
# DisplayPort audio = MultiMedia6 -> DISPLAY_PORT_RX_0 (HDMI0, hw:,5).

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# Pin the DSP stream gain to the topology's cap: Q13 8192 = 0 dB = stock's ceiling (stock's PAL applies at most
	# unity to a stream). 0.27r6 (owner, 11 Oct 2026): raised from the -12 dB placeholder 2056 (relay/answers/
	# pc-026-s8-s9.md); the speaker protection is the PipeWire chain in front (62-iceland-speakers.conf). Never above stock.
	# The control's name is truncated by ALSA. It must not be the PlaybackMixerElem: its dB metadata is wrong
	# (1 dB per step), so PipeWire keeps a software volume on top of the capped gain.
	# THE REPO IS THE SOURCE OF TRUTH for audio/ucm and audio/topology: sync your build copies FROM here.
	EnableSequence [
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	# Stock "headphones" path (mixer_paths.xml), in mainline control names:
	#   RX_HPH_PWR_MODE LOHIFI           -> 'RX_HPH PWR Mode' LOHIFI (RX macro compander coefficients)
	#   RX HPH Mode CLS_H_HIFI           -> 'RX HPH Mode' CLS_H_HIFI (WCD9395: class-H, HiFi)
	#   RX_MACRO RX0/1 MUX, INT0/1 MIX1 INP0, INT0/1 DEM MUX CLSH_DSM_OUT -> the same names
	#   HPHL/R Compander 1               -> 'HPHL_COMP Switch' / 'HPHR_COMP Switch' 1 (the codec compander and its
	#                                       SoundWire port; the gain then follows the compander, as on stock)
	#   HPHL/R XTALK 1                   -> no mainline control (not available)
	#   HPHL/R_RDAC Switch 1             -> the same names
	#   RX_RX0/1 Digital Volume 82       -> the same names, 82 = -2 dB (84 = 0 dB, 1 dB per step)
	#   HPHL/R Volume 16                 -> 'HPHL Volume' / 'HPHR Volume' 8: stock's value is the PA gain register
	#                                       (16 = -18 dB, +6 dB at 0, 1.5 dB per step); the mainline control is
	#                                       inverted (value = 24 - register) once the kernel's "wcd939x: fix the HPH
	#                                       volume register and scale" is in. It only acts while the compander is
	#                                       off; older kernels write unused bits (no effect either way)
	# The DSP stream gain is pinned to 0 dB (8192, the topology's cap) like the speakers. No PlaybackMixerElem:
	# PipeWire keeps a software volume (the RX digital gain goes up to +40 dB and the HPH gain is bypassed by the
	# compander, so neither is a safe hardware volume).
	EnableSequence [
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX HPH Mode' CLS_H_HIFI"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX_RX0 Digital Volume' 82"
		cset "name='RX_RX1 Digital Volume' 82"
		cset "name='HPHL Volume' 8"
		cset "name='HPHR Volume' 8"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL_COMP Switch' 1"
		cset "name='HPHR_COMP Switch' 1"
		cset "name='CLSH Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='CLSH Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	ConflictingDevice [
		"Headset"
	]

	# the settings that recorded cleanly (pc-026 S7): decimator 0 = AMIC1 (bottom) via ADC1 -> SWR_MIC0,
	# decimator 1 = AMIC5 (back); 0.28-46: ADC mode ADC_HIFI on both (stock's speaker-mic, camcorder-mic and
	# handset-mic paths: TX0 / TX3 MODE ADC_HIFI; here ADC1 = TX0, ADC3 = TX2; the driver's default was NORMAL),
	# TX_DEC volume 84 = stock's own decimator value (0 dB; 0.28-4, see below).
	# 0.28-46: AMIC5 moved from ADC2 to ADC3 (-> SWR_MIC2): ADC2 is the only ADC that takes AMIC2, the headset
	# microphone (stock: headset-mic = ADC2 CH2_AMIC2). Stock records AMIC5 on ADC4 (CH4_AMIC5) and on ADC3
	# (CH3_AMIC5, its oprec 4-channel path); our device tree routes ADC1-ADC3 to the TX macro (TX SWR_INPUT0-2), not
	# ADC4, so ADC3 needs no kernel change. map220v's Pad 4 UCM uses the same ADC3 / SWR_MIC2 path for AMIC5.
	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		# analog mic gain: 0 is "mute" in the WCD939x control's dB scale (the GNOME input meter stayed flat, area-audio-1);
		# 14 = stock's recorder path (oprec-mic), rule 13
		cset "name='ADC1 Volume' 14"
		cset "name='TX0 MODE' ADC_HIFI"
		cset "name='ADC3_MIXER Switch' 1"
		cset "name='ADC3 MUX' CH3_AMIC5"
		cset "name='ADC3 Switch' 1"
		cset "name='ADC3 Volume' 14"
		cset "name='TX2 MODE' ADC_HIFI"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		# digital mic gain: 84 is 0 dB = stock's mixer value; stock's recorder adds its ~14 dB later, in its DSP chain.
		# 0.28-4 (N2, 13 Oct 2026): back to stock's 84. 98 (stock's 84 + those 14 dB, 9 Oct) put the 14 dB in FRONT of
		# everything and left no headroom: with the tablet upright the speakers' own sound clipped the raw capture in this
		# decimator (r139b 1679, r141 68749 clipped samples at the +9 dB speaker make-up, mostly 2-10 kHz echo on the
		# bottom mic), so the echo canceller saw clipped (non-linear) echo. At 84 the decimator has stock's headroom; the
		# processed source's WebRTC gain control (60-iceland-mic-processing.conf, webrtc.gain_control) brings speech back
		# up after the echo canceller, where stock's DSP gain sits. The raw source "Internal microphones (raw)" is 14 dB
		# quieter than in 0.27r6 - 0.28-3 (= stock's codec level). Never above stock: ADC1/3 14 (stock's maximum for these
		# two microphones), TX_DEC 84 (stock's register value)
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC2"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC3_MIXER Switch' 0"
		cset "name='ADC3 MUX' CH3_AMIC_DISABLE"
		cset "name='ADC3 Switch' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixer "default:${CardId}"
	}
}

SectionDevice."Headset" {
	Comment "Headset microphone"

	ConflictingDevice [
		"Mic"
	]

	# Stock "headset-mic" = amic2 + ADC2 Volume 10 + TX_DEC0 Volume 84: ADC2 CH2_AMIC2, TX1 MODE ADC_LP (ADC2's mode),
	# the MBHC SoundWire channel on (stock: MBHC ChMap), decimator 0. MIC BIAS2 feeds AMIC2 (device tree).
	# CapturePriority 90 (below the internal mics' 100, upstream uses 200): ACP sums the device priorities into the
	# profile priority, and the internal-mic profile must stay the one picked by default. Using the headset mic is a
	# profile switch ("HiFi (Headphones, Headset, Speaker)") until the PCM is split.
	EnableSequence [
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' CH2_AMIC2"
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2 Volume' 10"
		cset "name='TX1 MODE' ADC_LP"
		cset "name='MBHC Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='MBHC Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CapturePriority 90
		CapturePCM "hw:${CardId},2"
		CaptureMixer "default:${CardId}"
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}

SectionDevice."HDMI0" {
	Comment "DisplayPort (USB-C display)"

	# MultiMedia6 -> DISPLAY_PORT_RX_0 (the route is on from the verb / boot, as ACP needs it to open the PCM); the DSP
	# stream gain stays at its topology default. Its own PCM (hw:,5), so it shares the profile with the speakers and
	# the headphones: no ConflictingDevice (upstream's x1e80100 UCMs list Speaker there, which makes ACP split the
	# profile, and WirePlumber does not switch profiles when a monitor is plugged). "DP0 Jack" is the card's DP jack.
	EnableSequence [
		cset "name='DISPLAY_PORT_RX_0 Audio Mixer MultiMedia6' 1"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},5"
		JackControl "DP0 Jack"
	}
}
