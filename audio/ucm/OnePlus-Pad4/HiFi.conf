# OnePlus Pad 4: speakers = MultiMedia1 -> PRIMARY_TDM_RX_0 (the DSP feeds the six TFA9865 over TDM; no mixer
# controls on that path, the amplifiers are configured by their driver); microphones = the two analog mics
# (AMIC1 -> ADC1, AMIC5 -> ADC2 on the WCD9395) -> TX macro SWR_MIC0/1 -> DEC0/1 -> TX_CODEC_DMA_TX_3 -> MultiMedia3.

SectionVerb {
	EnableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	# No speaker protection yet (the TFA9865 container isn't loaded): pin the DSP stream gain to the topology's
	# cap (Q13, 2056 = -12 dB, a PLACEHOLDER until the stock volume limits are known; relay/answers/pc-026-s8-s9.md).
	# The control's name is truncated by ALSA. It must not be the PlaybackMixerElem: its dB metadata is wrong
	# (1 dB per step), so PipeWire keeps a software volume on top of the capped gain.
	# THE REPO IS THE SOURCE OF TRUTH for audio/ucm and audio/topology: sync your build copies FROM here.
	EnableSequence [
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 2056"
	]

	DisableSequence [
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Mic" {
	Comment "Internal microphones"

	# the settings that recorded cleanly (pc-026 S7): decimator 0 = AMIC1 (bottom) via ADC1 -> SWR_MIC0,
	# decimator 1 = AMIC5 (back) via ADC2 -> SWR_MIC1, the ADC mode left at the driver's default,
	# TX_DEC volume 84 (0 dB, the stock value)
	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 MUX' CH1_AMIC1"
		cset "name='ADC1 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 MUX' CH2_AMIC5"
		cset "name='ADC2 Switch' 1"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC2 MUX' CH2_AMIC_DISABLE"
		cset "name='ADC2 Switch' 0"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureMixer "default:${CardId}"
	}
}
